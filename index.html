<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>رادار خبر — تقویم اقتصادی فارکس</title>

<script>
(function(){
  var t='auto';
  try{ var p=JSON.parse(localStorage.getItem('ffprefs')||'null'); if(p&&p.theme) t=p.theme; }catch(e){}
  var m=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches;
  document.documentElement.dataset.theme = (t==='auto' ? (m?'light':'dark') : t);
})();
</script>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  /* تم تیره ملایم و چشم‌نواز (Warm Slate Dark) */
  --bg:#13161c;
  --bg-deep:#0e1015;
  --bg-glow:#1b2029;
  --surface:#1b1f27;
  --surface-2:#232833;
  --surface-3:#2b313e;
  --border:#2a303c;
  --border-soft:#222731;
  --border-strong:#3a4252;

  --text:#e6e8ec;
  --text-sec:#9da3b0;
  --text-muted:#6c7280;
  --body-text:#cfd4de;

  /* رنگ‌های اهمیت با کنتراست ملایم */
  --hi:#e05a4f;
  --hi-bg:rgba(224,90,79,.09);
  --hi-bg-hover:rgba(224,90,79,.14);
  --hi-border:rgba(224,90,79,.32);
  --hi-ring:rgba(224,90,79,.18);

  --md:#df9b38;
  --md-bg:rgba(223,155,56,.08);
  --md-bg-hover:rgba(223,155,56,.13);
  --md-border:rgba(223,155,56,.28);

  --lo:#64748b;
  --lo-bg:rgba(100,116,139,.08);

  --up:#38b28b;
  --up-bg:rgba(56,178,139,.12);
  --down:#e05d72;
  --down-bg:rgba(224,93,114,.12);

  --accent:#df9b38;
  --accent-soft:rgba(223,155,56,.14);
  --header-bg:rgba(19,22,28,.86);
  --det-bg:rgba(14,16,21,.55);
  --shadow:0 10px 28px -10px rgba(0,0,0,.55);
  --bull-off:#353c4b;

  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

:root[data-theme="light"]{
  /* تم روشن گرم و کاغذی بدون سفیدی خیره‌کننده (Warm Soft Ivory) */
  --bg:#f4f1ea;
  --bg-deep:#ebe6dc;
  --bg-glow:#faf8f4;
  --surface:#fcfaf6;
  --surface-2:#eeeae1;
  --surface-3:#e3ded3;
  --border:#dcd6c9;
  --border-soft:#e5e0d5;
  --border-strong:#c6bfb0;

  --text:#1f2329;
  --text-sec:#5a606b;
  --text-muted:#868c98;
  --body-text:#343942;

  --hi:#c84337;
  --hi-bg:rgba(200,67,55,.065);
  --hi-bg-hover:rgba(200,67,55,.11);
  --hi-border:rgba(200,67,55,.28);
  --hi-ring:rgba(200,67,55,.14);

  --md:#b87614;
  --md-bg:rgba(184,118,20,.07);
  --md-bg-hover:rgba(184,118,20,.12);
  --md-border:rgba(184,118,20,.26);

  --lo:#64748b;
  --lo-bg:rgba(100,116,139,.08);

  --up:#14805e;
  --up-bg:rgba(20,128,94,.1);
  --down:#be364d;
  --down-bg:rgba(190,54,77,.1);

  --accent:#b87614;
  --accent-soft:rgba(184,118,20,.12);
  --header-bg:rgba(244,241,234,.88);
  --det-bg:rgba(235,230,220,.55);
  --shadow:0 10px 26px -10px rgba(45,40,30,.15);
  --bull-off:#d2ccc0;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:radial-gradient(120% 70% at 50% 0%,var(--bg-glow) 0%,var(--bg) 55%,var(--bg-deep) 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;
  font-size:14.5px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  padding-bottom:48px;
  transition:background-color .2s ease,color .2s ease;
}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
:where(.iconbtn,.seg-btn,.chip,.ev,tr.row):focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* ---------- سربرگ ---------- */
header{
  position:sticky;
  top:0;
  z-index:30;
  background:var(--header-bg);
  backdrop-filter:blur(16px) saturate(1.2);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);
  border-bottom:1px solid var(--border-soft);
}
.head-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:11px 0;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.brand-logo{
  width:34px;
  height:34px;
  border-radius:10px;
  background:var(--surface-2);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.brand-logo svg{width:20px;height:20px}
.brand-txt{line-height:1.25}
.brand-txt b{
  font-size:17.5px;
  font-weight:800;
  letter-spacing:-.3px;
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--text);
}
.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--hi);
  box-shadow:0 0 0 3px var(--hi-ring);
  display:inline-block;
}
.brand-txt span{
  font-size:11px;
  color:var(--text-muted);
  display:block;
}
.toolbar{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:nowrap;
}
.iconbtn{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-sec);
  border-radius:10px;
  height:34px;
  padding:0 10px;
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  transition:all .15s ease;
  white-space:nowrap;
}
.iconbtn svg{
  width:15px;
  height:15px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex:0 0 auto;
}
.iconbtn:hover{
  color:var(--text);
  border-color:var(--border-strong);
  background:var(--surface-2);
}
.iconbtn:active{transform:scale(.97)}
.iconbtn:disabled{opacity:.45;cursor: default}
.iconbtn.icon-only{width:34px;padding:0}

/* منوی انتخاب تم */
.tw{position:relative;display:inline-flex}
.themepop{
  position:absolute;
  top:calc(100% + 7px);
  inset-inline-end:0;
  z-index:40;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:13px;
  padding:5px;
  min-width:148px;
  display:flex;
  flex-direction:column;
  gap:2px;
  box-shadow:var(--shadow);
}
.themepop[hidden]{display:none}
.topt{
  background:transparent;
  border:0;
  color:var(--text-sec);
  font-family:inherit;
  font-size:12.5px;
  font-weight:500;
  text-align:start;
  padding:8px 10px;
  border-radius:9px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  transition:.12s;
}
.topt:hover{background:var(--surface-2);color:var(--text)}
.topt::before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  flex:0 0 auto;
  border:1.5px solid var(--text-muted);
  background:transparent;
}
.topt[aria-selected="true"]{
  color:var(--text);
  background:var(--surface-2);
  font-weight:700;
}
.topt[aria-selected="true"]::before{
  background:var(--accent);
  border-color:var(--accent);
}
.topt small{margin-inline-start:auto;font-size:10px;color:var(--text-muted);font-weight:400}

/* ---------- کارت خبر مهم بعدی (بازطراحی شده) ---------- */
.next{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px 16px;
  margin:14px 0 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:all .2s ease;
}
.next::before{
  content:"";
  position:absolute;
  inset-inline-start:0;
  top:0;
  bottom:0;
  width:4px;
  background:var(--border-strong);
}
.next.hi{
  background:linear-gradient(135deg,var(--hi-bg) 0%,var(--surface) 90%);
  border-color:var(--hi-border);
}
.next.hi::before{background:var(--hi)}
.next.md{
  background:linear-gradient(135deg,var(--md-bg) 0%,var(--surface) 90%);
  border-color:var(--md-border);
}
.next.md::before{background:var(--md)}
.next.hi.soon{
  box-shadow:0 0 0 2px var(--hi-ring),var(--shadow);
}

.next-info{
  flex:1;
  min-width:0;
}
.next-meta{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:5px;
}
.next-badge{
  font-size:11px;
  font-weight:600;
  color:var(--text-sec);
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.next.hi .next-badge{color:var(--hi)}
.next.md .next-badge{color:var(--md)}
.next-cur{
  font-family:var(--mono);
  font-size:11px;
  font-weight:600;
  background:var(--surface-2);
  border:1px solid var(--border);
  padding:1px 7px;
  border-radius:6px;
  color:var(--text);
  display:inline-flex;
  align-items:center;
  gap:4px;
  direction:ltr;
}
.next-time{
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--text-sec);
  direction:ltr;
}
.next-title{
  font-weight:800;
  font-size:16px;
  line-height:1.45;
  color:var(--text);
  margin:0;
}
.next-en{
  font-size:11px;
  color:var(--text-muted);
  direction:ltr;
  text-align:start;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:2px;
}

.next-side{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:7px;
  flex:0 0 auto;
}

/* آیکون‌های سر گاو (Bulls) */
.bulls{
  display:inline-flex;
  align-items:center;
  gap:4px;
  direction:ltr;
}
.bull{
  width:22px;
  height:22px;
  flex:0 0 auto;
  fill:var(--bull-off);
  transition:transform .15s ease,fill .15s ease;
}
.bulls.hi .bull.on{
  fill:var(--hi);
  filter:drop-shadow(0 1px 3px rgba(224,90,79,.28));
}
.bulls.md .bull.on{
  fill:var(--md);
  filter:drop-shadow(0 1px 3px rgba(223,155,56,.25));
}
.bulls.lo .bull.on{
  fill:var(--lo);
}
/* سایز کوچک‌تر گاوها برای داخل جدول و کارت‌ها */
.bulls.sm{gap:2px}
.bulls.sm .bull{width:16px;height:16px}

/* شمارشگر دیجیتال سگمنت‌شده (Countdown) */
.cd-box{
  display:inline-flex;
  align-items:center;
  gap:4px;
  direction:ltr;
  font-family:var(--mono);
  font-variant-numeric:tabular-nums;
}
.cd-seg{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:8px;
  min-width:36px;
  padding:4px 6px 3px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.12);
}
.next.hi .cd-seg{
  border-color:var(--hi-border);
  background:var(--surface);
}
.cd-val{
  font-size:15.5px;
  font-weight:700;
  line-height:1.1;
  color:var(--text);
  letter-spacing:.3px;
}
.next.hi.soon .cd-val{color:var(--hi)}
.cd-lbl{
  font-family:"Vazirmatn",sans-serif;
  font-size:8.5px;
  color:var(--text-muted);
  margin-top:2px;
  line-height:1;
}
.cd-sep{
  font-weight:700;
  font-size:14px;
  color:var(--text-muted);
  margin-top:-6px;
}
.cd-now{
  background:var(--hi-bg);
  border:1px solid var(--hi-border);
  color:var(--hi);
  font-family:"Vazirmatn",sans-serif;
  font-size:12.5px;
  font-weight:700;
  padding:5px 12px;
  border-radius:9px;
}

/* ---------- پنل فیلترها ---------- */
.filter-panel{
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:14px;
  padding:9px 10px;
  margin-bottom:14px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.filter-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}
.seg-group{
  display:inline-flex;
  background:var(--surface-2);
  border:1px solid var(--border-soft);
  border-radius:10px;
  padding:3px;
  gap:2px;
}
.seg-btn{
  background:transparent;
  border:0;
  color:var(--text-sec);
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  padding:4px 11px;
  border-radius:7px;
  cursor:pointer;
  white-space:nowrap;
  transition:all .15s ease;
}
.seg-btn:hover{color:var(--text)}
.seg-btn[aria-pressed="true"]{
  background:var(--surface);
  color:var(--text);
  box-shadow:0 1px 3px rgba(0,0,0,.18);
}

.cur-row{
  display:flex;
  align-items:center;
  gap:6px;
  overflow-x:auto;
  padding:2px 1px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.cur-row::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  background:var(--surface-2);
  border:1px solid var(--border-soft);
  color:var(--text-sec);
  border-radius:9px;
  padding:4px 10px;
  font-family:var(--mono);
  font-size:11.5px;
  font-weight:600;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:5px;
  white-space:nowrap;
  transition:all .15s ease;
  direction:ltr;
}
.chip.all-cur{
  font-family:"Vazirmatn",sans-serif;
  direction:rtl;
  font-size:11.5px;
}
.chip i{font-style:normal;font-size:13px;line-height:1}
.chip:hover{
  color:var(--text);
  border-color:var(--border-strong);
}
.chip[aria-pressed="true"]{
  background:var(--accent-soft);
  color:var(--accent);
  border-color:var(--md-border);
}

/* ---------- جداکننده روز و خط زمان فعلی ---------- */
#list{position:relative}
.day{
  position:sticky;
  top:57px;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  margin:14px 0 9px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:11px;
  box-shadow:0 4px 14px -8px rgba(0,0,0,.35);
}
.day-right{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.day-rel{
  background:var(--accent-soft);
  color:var(--accent);
  border:1px solid var(--md-border);
  padding:1px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:700;
}
.day-rel.today{
  background:var(--hi-bg);
  color:var(--hi);
  border-color:var(--hi-border);
}
.day-main{
  font-size:13px;
  font-weight:800;
  color:var(--text);
}
.day-en{
  font-family:var(--mono);
  font-size:11px;
  font-weight:600;
  color:var(--text-muted);
  direction:ltr;
  white-space:nowrap;
}
.nowline{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:8px;
  margin:4px 0 10px;
}
.nowline b{
  font-family:var(--mono);
  font-size:11px;
  font-weight:600;
  color:var(--hi);
  background:var(--hi-bg);
  border:1px solid var(--hi-border);
  padding:1px 8px;
  border-radius:99px;
  direction:ltr;
  font-variant-numeric:tabular-nums;
}
.nowline i{
  flex:1;
  height:1px;
  background:linear-gradient(to left,var(--hi),transparent);
}

/* ---------- نمای کارت‌ها ---------- */
.ev{
  position:relative;
  z-index:1;
  width:100%;
  text-align:start;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:14px;
  padding:12px 14px;
  margin-bottom:9px;
  color:inherit;
  font-family:inherit;
  display:grid;
  grid-template-columns:58px 1fr;
  gap:0 12px;
  cursor:pointer;
  transition:border-color .15s,background .15s,opacity .2s,transform .1s;
  overflow:hidden;
}
.ev::before{
  content:"";
  position:absolute;
  inset-inline-start:0;
  top:0;
  bottom:0;
  width:3.5px;
  background:var(--border-strong);
}
.ev:hover{border-color:var(--border-strong)}
.ev.past{opacity:.48}
.ev.hi{
  background:var(--hi-bg);
  border-color:var(--hi-border);
}
.ev.hi::before{background:var(--hi)}
.ev.md{
  background:var(--md-bg);
  border-color:var(--md-border);
}
.ev.md::before{background:var(--md)}
.ev.lo::before{background:var(--border-strong)}
.ev.hi:hover{background:var(--hi-bg-hover)}
.ev.md:hover{background:var(--md-bg-hover)}
.ev.hi.soon{
  box-shadow:0 0 0 1.5px var(--hi-ring);
}
.ev.hi.soon .rel{color:var(--hi);font-weight:600}

.chev{
  position:absolute;
  inset-inline-end:12px;
  top:14px;
  color:var(--text-muted);
  font-size:11px;
  line-height:1;
  transition:transform .18s;
  pointer-events:none;
}
.ev[aria-expanded="true"] .chev{
  transform:rotate(180deg);
  color:var(--text);
}
.tcol{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:3px;
  padding-top:1px;
}
.tcol .t{
  font-family:var(--mono);
  font-size:15px;
  font-weight:700;
  direction:ltr;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.3px;
  color:var(--text);
}
.tcol .rel{
  font-size:10px;
  color:var(--text-muted);
  white-space:nowrap;
}

.ev-head{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  padding-inline-end:18px;
}
.cur-badge{
  font-family:var(--mono);
  font-size:11px;
  font-weight:600;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:1px 6px;
  color:var(--text);
  display:inline-flex;
  align-items:center;
  gap:4px;
  direction:ltr;
}
.cur-badge i{font-style:normal;font-size:12.5px}
.en{
  font-size:10.5px;
  color:var(--text-muted);
  direction:ltr;
  text-align:start;
  letter-spacing:.1px;
}
.fa{
  font-size:15px;
  font-weight:700;
  margin-top:4px;
  line-height:1.45;
  color:var(--text);
}
.why{
  font-size:12.5px;
  color:var(--text-sec);

<script>
/* ============ دیکشنری فارسی رویدادها: [نام, این چیه و چرا مهمه, اثر بالاتر از انتظار] ============ */
const D = {
"cpi":["شاخص قیمت مصرف‌کننده","تورم مصرف‌کننده؛ اصلی‌ترین ورودی تصمیم نرخ بهره بانک مرکزی.","تورم داغ‌تر → انتظار نرخ بهره بالاتر → تقویت ارز و فشار فروش روی طلا."],
"core cpi":["شاخص قیمت مصرف‌کننده هسته","تورم بدون خوراک و انرژی؛ بانک‌های مرکزی بیشتر به همین نگاه می‌کنند.","بالاتر از انتظار → سیاست انقباضی‌تر → ارز قوی‌تر، طلا زیر فشار."],
"cpi flash estimate":["برآورد اولیه تورم","اولین تخمین تورم منطقه یورو؛ زودتر از رقم نهایی بازار را حرکت می‌دهد.","بالاتر از انتظار → یورو قوی‌تر."],
"trimmed mean cpi":["تورم میانگین تعدیل‌شده","معیار تورم پایدارِ موردنظر بانک مرکزی استرالیا.","بالاتر از انتظار → احتمال نرخ بهره بالاتر → تقویت ارز."],
"ppi":["شاخص قیمت تولیدکننده","تورم در سطح تولید؛ پیش‌نشانه تورم مصرف‌کننده.","بالاتر از انتظار → انتظار تورم بیشتر → تقویت ارز."],
"core ppi":["شاخص قیمت تولیدکننده هسته","تورم تولید بدون اقلام پرنوسان.","بالاتر از انتظار → ارز قوی‌تر."],
"wpi":["شاخص قیمت عمده‌فروشی","تورم در سطح عمده‌فروشی قبل از رسیدن به مصرف‌کننده.","بالاتر از انتظار → تقویت ارز."],
"pce price index":["شاخص قیمت مخارج مصرف شخصی","معیار تورم موردعلاقه فدرال‌رزرو.","بالاتر از انتظار → دلار قوی‌تر، طلا زیر فشار."],
"core pce price index":["شاخص قیمت PCE هسته","دقیق‌ترین معیار تورمی که فدرال‌رزرو تصمیمش را با آن می‌گیرد؛ از مهم‌ترین خبرهای ماه.","بالاتر از انتظار → کاهش امید به کاهش نرخ بهره → دلار قوی، طلا نزولی."],
"import prices":["قیمت کالاهای وارداتی","تورم وارداتی؛ اثر نرخ ارز روی قیمت‌ها.","بالاتر از انتظار → فشار تورمی بیشتر."],
"inflation expectations":["انتظارات تورمی","تصور مردم و بازار از تورم آینده؛ بانک مرکزی روی لنگر بودنش حساس است.","بالاتر از انتظار → نگرانی بانک مرکزی → ارز قوی‌تر."],
"mi inflation expectations":["انتظارات تورمی ملبورن","انتظار خانوارهای استرالیایی از تورم ۱۲ ماه آینده.","بالاتر از انتظار → تقویت AUD."],
"non-farm employment change":["اشتغال غیرکشاورزی (NFP)","تعداد شغل‌های ایجادشده در آمریکا؛ پرنوسان‌ترین خبر ماه برای دلار و طلا.","خیلی بهتر از انتظار → دلار جهش، طلا افت شدید."],
"adp non-farm employment change":["اشتغال بخش خصوصی ADP","پیش‌درآمد NFP از داده حقوق‌ودستمزد شرکت‌ها.","بالاتر از انتظار → انتظار NFP قوی → دلار قوی‌تر."],
"adp weekly employment change":["اشتغال هفتگی ADP","نبض هفتگی بازار کار آمریکا؛ داده کم‌وزن ولی پرتکرار.","بالاتر از انتظار → دلار کمی قوی‌تر."],
"employment change":["تغییر اشتغال","خالص شغل‌های ایجادشده؛ سلامت بازار کار.","بالاتر از انتظار → تقویت ارز."],
"unemployment rate":["نرخ بیکاری","درصد جویندگان کار؛ نیمه دوم مأموریت بانک مرکزی.","پایین‌تر از انتظار (بازار کار داغ) → ارز قوی‌تر."],
"unemployment claims":["مدعیان بیکاری هفتگی","تعداد درخواست‌های جدید بیمه بیکاری؛ سریع‌ترین نشانه ضعف بازار کار.","پایین‌تر از انتظار → بازار کار قوی → دلار قوی‌تر."],
"average hourly earnings":["میانگین دستمزد ساعتی","رشد دستمزد؛ سوخت تورم خدماتی.","بالاتر از انتظار → نگرانی تورمی → ارز قوی‌تر."],
"wage price index":["شاخص دستمزد","رشد دستمزدها؛ ورودی مهم تورم.","بالاتر از انتظار → تقویت ارز."],
"jolts job openings":["فرصت‌های شغلی JOLTS","تعداد جایگاه‌های خالی؛ معیار تقاضای نیروی کار.","بالاتر از انتظار → بازار کار سفت → دلار قوی‌تر."],
"challenger job cuts":["اخراج‌های اعلام‌شده Challenger","تعداد تعدیل نیروی اعلامی شرکت‌های آمریکایی.","بالاتر از انتظار → ضعف بازار کار → دلار ضعیف‌تر."],
"prelim benchmark payrolls revision":["تجدیدنظر معیار اشتغال","بازنگری سالانه آمار اشتغال؛ می‌تواند تصویر بازار کار را کاملاً عوض کند.","تجدیدنظر منفی بزرگ → دلار ضعیف، طلا صعودی."],
"claimant count change":["تغییر مدعیان بیکاری","تعداد متقاضیان مزایای بیکاری در بریتانیا.","کمتر از انتظار → پوند قوی‌تر."],
"retail sales":["خرده‌فروشی","مخارج مصرف‌کننده؛ موتور اصلی رشد اقتصادی.","بالاتر از انتظار → اقتصاد قوی → تقویت ارز."],
"core retail sales":["خرده‌فروشی هسته","خرده‌فروشی بدون خودرو؛ تصویر تمیزتر از مصرف.","بالاتر از انتظار → تقویت ارز."],
"manufacturing sales":["فروش بخش تولیدی","حجم فروش کارخانه‌ها؛ پیش‌نگر سلامت صنعت.","بالاتر از انتظار → تقویت ارز."],
"wholesale sales":["فروش عمده‌فروشی","حجم معاملات در سطح عمده‌فروشی.","بالاتر از انتظار → تقویت ارز."],
"gdp":["تولید ناخالص داخلی","نرخ رشد کل اقتصاد؛ گسترده‌ترین معیار سلامت اقتصادی.","بالاتر از انتظار → تقویت ارز."],
"gdp price index":["شاخص قیمت تولید ناخالص داخلی","تورم در کل اقتصاد، نه فقط سبد مصرف.","بالاتر از انتظار → فشار تورمی → تقویت ارز."],
"manufacturing pmi":["شاخص مدیران خرید تولیدی","نظرسنجی مدیران خرید صنعت؛ بالای ۵۰ یعنی رشد، زیر ۵۰ یعنی انقباض.","بالاتر از انتظار → تقویت ارز."],
"services pmi":["شاخص مدیران خرید خدمات","بخش خدمات سهم بزرگ‌تری از اقتصاد دارد، پس معمولاً مهم‌تر از تولیدی است.","بالاتر از انتظار → تقویت ارز."],
"composite pmi":["شاخص مدیران خرید مرکب","ترکیب تولید و خدمات؛ عکس کلی اقتصاد.","بالاتر از انتظار → تقویت ارز."],
"construction pmi":["شاخص مدیران خرید ساختمان","فعالیت بخش ساخت‌وساز.","بالاتر از انتظار → تقویت ارز."],
"businessnz manufacturing index":["شاخص تولیدی BusinessNZ","وضعیت بخش تولید صنعتی نیوزیلند؛ بالای ۵۰ نشانه انبساط است.","بالاتر از انتظار → تقویت NZD."],

const REGION = {german:"آلمان",french:"فرانسه",italian:"ایتالیا",spanish:"اسپانیا",belgian:"بلژیک",
  dutch:"هلند",greek:"یونان",swiss:"سوئیس",tokyo:"توکیو",national:"سراسری",german_:"آلمان"};
const QUAL = {prelim:"مقدماتی",flash:"اولیه",final:"نهایی",revised:"بازبینی‌شده",advance:"پیشاپیش",
  "second estimate":"برآورد دوم","third estimate":"برآورد سوم",monthly:"ماهانه",weekly:"هفتگی",annual:"سالانه"};
const PERIOD = {"m/m":"ماهانه","y/y":"سالانه","q/q":"فصلی","q/y":"فصلی-سالانه","w/w":"هفتگی"};

function lookup(title){
  let t = title.toLowerCase().trim();
  let pre = [], per = "";

  const pm = t.match(/\s(m\/m|y\/y|q\/q|q\/y|w\/w)$/);
  if(pm){ per = PERIOD[pm[1]]; t = t.slice(0, pm.index).trim(); }

  for(const r in REGION){
    if(t.startsWith(r + " ")){ pre.push(REGION[r]); t = t.slice(r.length+1); break; }
  }
  for(const q in QUAL){
    if(t.startsWith(q + " ")){ pre.push(QUAL[q]); t = t.slice(q.length+1); break; }
  }

  let hit = D[t];

  if(!hit && /\bspeaks$/.test(t)){
    const who = title.replace(/\s+speaks$/i,'');
    return {fa:"سخنرانی " + who, why:"لحن و اشاره به مسیر نرخ بهره می‌تواند بازار را حرکت دهد.",
            eff:"لحن انقباضی معمولاً ارز را تقویت و طلا را تضعیف می‌کند."};
  }
  if(!hit && /bond auction$/.test(t)){
    return {fa:"حراج اوراق قرضه" + (pre.length ? " " + pre.join(" ") : ""),
            why:"بازده و تقاضای اوراق دولتی؛ سنجه اشتهای ریسک و انتظار تورم.",
            eff:"بازده بالاتر → فشار روی طلا و سهام."};
  }
  if(!hit && /holiday$/.test(t)){
    return {fa:"تعطیلی بازار" + (pre.length ? " " + pre.join(" ") : ""),
            why:"بازار آن کشور تعطیل است؛ نقدشوندگی پایین و اسپرد بالا.",
            eff:"نوسان‌های بی‌پشتوانه محتمل است؛ معامله محتاطانه."};
  }
  if(!hit) return null;

  const label = (pre.length ? pre.join(" — ") + " — " : "") + hit[0] + (per ? " (" + per + ")" : "");
  return {fa:label, why:hit[1], eff:hit[2]};
}

/* ===================== state ===================== */
const S = {events:[], imp:'med', scope:'week', curs:new Set(), tz:'device', view:'cards',
           theme:'auto', open:new Set(), last:0, src:''};
const FLAG = {USD:"🇺🇸",EUR:"🇪🇺",GBP:"🇬🇧",JPY:"🇯🇵",CHF:"🇨🇭",CAD:"🇨🇦",AUD:"🇦🇺",NZD:"🇳🇿",CNY:"🇨🇳",All:"🌐"};
const key = e => e.title + '|' + e.country + '|' + e.date;

/* ===================== data ===================== */
const FEED = 'https://nfs.faireconomy.media/ff_calendar_thisweek.json';
const SOURCES = [
  {s:'repo', u:() => './calendar.json?t=' + Math.floor(Date.now()/6e5)},
  {s:'live', u:() => FEED},
  {s:'live', u:() => 'https://cdn-nfs.faireconomy.media/ff_calendar_thisweek.json'},
  {s:'live', u:() => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(FEED)},
  {s:'live', u:() => 'https://corsproxy.io/?url=' + encodeURIComponent(FEED)}
];

async function loadEvents(){
  for(const src of SOURCES){
    try{
      const r = await fetch(src.u(), {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const txt = await r.text();
      const a = txt.indexOf('[');
      if(a < 0) throw new Error('پاسخ نامعتبر');
      const data = JSON.parse(txt.slice(a, txt.lastIndexOf(']')+1));
      if(!Array.isArray(data) || !data.length) throw new Error('خالی');
      S.src = src.s;
      save(data);
      return data.filter(e => e && e.date && e.title);
    }catch(e){}
  }
  const cached = restore();
  if(cached){ S.src = 'cache'; return cached; }
  S.src = 'fallback';
  return FALLBACK_EVENTS;
}

function save(d){ try{ localStorage.setItem('ffcal', JSON.stringify({t:Date.now(), d})); }catch(e){} }
function restore(){
  try{
    const o = JSON.parse(localStorage.getItem('ffcal') || 'null');
    if(o && Date.now() - o.t < 8*864e5) return o.d;
  }catch(e){}
  return null;
}
function loadPrefs(){
  try{
    const p = JSON.parse(localStorage.getItem('ffprefs') || 'null');
    if(p){ S.imp = p.imp || S.imp; S.scope = p.scope || S.scope; S.tz = p.tz || S.tz;
           S.view = p.view || S.view; S.theme = p.theme || S.theme;
           S.curs = new Set(p.curs || []); }
  }catch(e){}
}
function savePrefs(){
  try{ localStorage.setItem('ffprefs', JSON.stringify(
    {imp:S.imp, scope:S.scope, tz:S.tz, view:S.view, theme:S.theme, curs:[...S.curs]})); }catch(e){}
}

/* ===================== time ===================== */
const tzOpt = () => S.tz === 'tehran' ? {timeZone:'Asia/Tehran'} : {};
const fmtTime = d => new Intl.DateTimeFormat('en-GB', Object.assign({hour:'2-digit',minute:'2-digit',hour12:false}, tzOpt())).format(d);
const dayKey = d => new Intl.DateTimeFormat('en-CA', Object.assign({year:'numeric',month:'2-digit',day:'2-digit'}, tzOpt())).format(d);
const weekday = d => new Intl.DateTimeFormat('fa-IR', Object.assign({weekday:'long'}, tzOpt())).format(d);
const dateFa = d => new Intl.DateTimeFormat('fa-IR-u-nu-latn', Object.assign({day:'numeric',month:'long'}, tzOpt())).format(d);
const dateEn = d => new Intl.DateTimeFormat('en-GB', Object.assign({weekday:'short',day:'numeric',month:'short'}, tzOpt())).format(d);
function dayRelLabel(dk){
  const now = Date.now();
  if(dk === dayKey(new Date(now))) return {txt:'امروز', cls:'today'};
  if(dk === dayKey(new Date(now + 864e5))) return {txt:'فردا', cls:''};
  if(dk === dayKey(new Date(now - 864e5))) return {txt:'دیروز', cls:''};
  return null;
}

function relTime(ms){
  const m = Math.round(Math.abs(ms)/60000);
  if(m < 1) return 'همین حالا';
  const h = Math.floor(m/60), d = Math.floor(h/24);
  let s = d >= 1 ? d + ' روز' : h >= 1 ? h + ' ساعت' : m + ' دقیقه';
  return ms > 0 ? s + ' دیگر' : s + ' پیش';
}

/* ساخت شمارشگر دیجیتال باکس‌دار */
function countdownHTML(ms){
  if(ms <= 0) return '<span class="cd-now">در حال انتشار</span>';
  const t = Math.floor(ms/1000), p = n => String(n).padStart(2,'0');
  const d = Math.floor(t/86400), h = Math.floor(t%86400/3600), m = Math.floor(t%3600/60), s = t%60;
  if(d > 0){
    return '<div class="cd-box">' +
      '<div class="cd-seg"><span class="cd-val">'+p(d)+'</span><span class="cd-lbl">روز</span></div>' +
      '<span class="cd-sep">:</span>' +
      '<div class="cd-seg"><span class="cd-val">'+p(h)+'</span><span class="cd-lbl">ساعت</span></div>' +
      '<span class="cd-sep">:</span>' +
      '<div class="cd-seg"><span class="cd-val">'+p(m)+'</span><span class="cd-lbl">دقیقه</span></div>' +
    '</div>';
  }
  return '<div class="cd-box">' +
    '<div class="cd-seg"><span class="cd-val">'+p(h)+'</span><span class="cd-lbl">ساعت</span></div>' +
    '<span class="cd-sep">:</span>' +
    '<div class="cd-seg"><span class="cd-val">'+p(m)+'</span><span class="cd-lbl">دقیقه</span></div>' +
    '<span class="cd-sep">:</span>' +
    '<div class="cd-seg"><span class="cd-val">'+p(s)+'</span><span class="cd-lbl">ثانیه</span></div>' +
  '</div>';
}

/* ===================== filters ===================== */
const isHoliday = i => i === 'Holiday';
const rank = i => (i === 'High' || isHoliday(i)) ? 3 : i === 'Medium' ? 2 : 1;
function passes(e){
  const r = rank(e.impact);
  if(S.imp === 'high' && r < 3) return false;
  if(S.imp === 'med' && r < 2) return false;
  if(S.curs.size && !S.curs.has(e.country)) return false;
  if(S.scope === 'today' && dayKey(new Date(e.date)) !== dayKey(new Date())) return false;
  return true;
}

/* ===================== render ===================== */
const esc = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const impClass = i => (i === 'High' || isHoliday(i)) ? 'hi' : i === 'Medium' ? 'md' : 'lo';
const num = v => parseFloat(String(v).replace(/[^0-9.\-]/g,''));

function bullsHTML(imp, small){
  const n = rank(imp), cls = impClass(imp) + (small ? ' sm' : '');
  let out = '<span class="bulls '+cls+'" aria-label="اهمیت '+esc(imp)+'">';
  for(let i=1;i<=3;i++){
    out += '<svg class="bull'+(i <= n ? ' on' : '')+'" viewBox="0 0 24 24"><use href="#bull"/></svg>';
  }
  return out + '</span>';
}

function valsHTML(e){
  const out = [];
  if(e.actual){
    const f = num(e.forecast), a = num(e.actual);
    const cls = (!isNaN(f) && !isNaN(a)) ? (a > f ? ' up' : a < f ? ' down' : '') : '';
    out.push('<span class="val-pill'+cls+'">واقعی <b>'+esc(e.actual)+'</b></span>');
  }
  if(e.forecast) out.push('<span class="val-pill">پیش‌بینی <b>'+esc(e.forecast)+'</b></span>');
  if(e.previous) out.push('<span class="val-pill">قبلی <b>'+esc(e.previous)+'</b></span>');
  return out.length ? '<div class="vals">'+out.join('')+'</div>' : '';
}

function bodyHTML(e, info){
  let html = '';
  if(info){
    html += '<h4>این خبر چیست</h4><p>'+esc(info.why)+'</p>';
    html += '<h4>اثر روی بازار</h4><p>'+esc(info.eff)+'</p>';
  }else{
    html += '<p>این رویداد در دیکشنری نیست. عنوان انگلیسی‌اش را در فارکس‌فکتوری ببین.</p>';
  }
  if(e.forecast && e.previous){
    const f = num(e.forecast), p = num(e.previous);
    if(!isNaN(f) && !isNaN(p)){
      const dir = f > p ? 'بهتر از دوره قبل' : f < p ? 'ضعیف‌تر از دوره قبل' : 'هم‌سطح دوره قبل';
      html += '<h4>انتظار بازار</h4><p>بازار رقمی '+dir+' انتظار دارد ('+esc(e.previous)+' → '+esc(e.forecast)+'). '+
              'انحراف از پیش‌بینی است که حرکت می‌سازد، نه خودِ عدد.</p>';
    }
  }
  if(isHoliday(e.impact)){
    html += '<h4>نکته معاملاتی تعطیلی بانکی</h4><p>در روزهای تعطیلی بانکی نقدشوندگی بازار کاهش می‌یابد، اسپردها ممکن است باز شوند و حرکت‌های قیمت گاهی کم‌رمق یا فریبنده هستند.</p>';
  }else if(rank(e.impact) === 3){
    html += '<h4>نکته اجرایی</h4><p>در دقایق اطراف این خبر اسپرد باز می‌شود و استاپ‌ها راحت شکار می‌شوند. '+
            'اگر پوزیشن باز داری، حجم و استاپ را قبلش تنظیم کن.</p>';
  }
  return html;
}

  if(S.view === 'table') renderTable(); else renderCards();
  renderNext();

function renderCards(){
  const list = document.getElementById('list');
  const evs = S.events.filter(passes);
  if(!evs.length){
    list.innerHTML = '<div class="state"><b>خبری با این فیلترها نیست</b>فیلتر اهمیت، ارز یا بازه زمانی را بازتر کن.</div>';
    return;
  }
  const now = Date.now(), today = dayKey(new Date()), tmr = dayKey(new Date(Date.now()+864e5));
  let html = '', cur = '', nowIns = false;
  for(const e of evs){
    const d = new Date(e.date), dk = dayKey(d);
    if(dk !== cur){
      cur = dk;
      const rel = dayRelLabel(dk);
      const relHtml = rel ? '<span class="day-rel '+rel.cls+'">'+rel.txt+'</span>' : '';
      html += '<div class="day"><div class="day-right">'+relHtml+

        '<span class="day-en">'+dateEn(d)+'</span></div>';
    }
    if(!nowIns && dk === today && d.getTime() > now){
      html += '<div class="nowline"><b data-now>اکنون '+fmtTime(new Date())+'</b><i></i></div>';
      nowIns = true;
    }
    const k = key(e), info = lookup(e.title), open = S.open.has(k), diff = d.getTime()-now;
    const soon = rank(e.impact) === 3 && diff > 0 && diff < 60*60*1000 ? ' soon' : '';
    html += '<button class="ev '+impClass(e.impact)+soon+(diff < -36e5 ? ' past':'')+'" data-k="'+esc(k)+'" aria-expanded="'+open+'">'+
      '<span class="chev">\u25BE</span>'+

      '<div><div class="ev-head">'+
        '<span class="cur-badge"><i>'+(FLAG[e.country] || '')+'</i>'+esc(e.country)+'</span>'+

        '<span class="en">'+esc(e.title)+'</span>'+

      '<div class="fa">'+esc(info ? info.fa : e.title)+'</div>'+

    '<div class="next-side">'+
      bullsHTML(n.impact, false)+
      '<div data-cd-big="'+t+'">'+countdownHTML(t-now)+'</div>'+
    '</div>'+
  '</div>';
}

setInterval(() => {
  const now = Date.now();
  document.querySelectorAll('[data-cd]').forEach(el => el.textContent = relTime(+el.dataset.cd - now));
  const b = document.querySelector('[data-cd-big]');
  if(b) b.innerHTML = countdownHTML(+b.dataset.cdBig - now);
  const nw = document.querySelector('[data-now]');
  if(nw) nw.textContent = 'اکنون ' + fmtTime(new Date());
}, 1000);

/* ===================== interactions ===================== */
document.getElementById('list').addEventListener('click', ev => {
  const el = ev.target.closest('.ev, tr.row'); if(!el) return;
  const k = el.dataset.k;
  S.open.has(k) ? S.open.delete(k) : S.open.add(k);
  render();
});
document.getElementById('viewBtn').addEventListener('click', () => {
  S.view = S.view === 'cards' ? 'table' : 'cards';
  document.getElementById('viewTxt').textContent = S.view === 'table' ? 'کارت' : 'جدول';
  savePrefs(); render();
});
document.getElementById('scopeFilters').addEventListener('click', ev => {
  const c = ev.target.closest('.seg-btn'); if(!c) return;
  if(c.dataset.scope){
    S.scope = c.dataset.scope;
    document.querySelectorAll('#scopeFilters .seg-btn[data-scope]').forEach(x => x.setAttribute('aria-pressed', x === c));
  }else if(c.dataset.imp){
    S.imp = c.dataset.imp;
    document.querySelectorAll('#scopeFilters .seg-btn[data-imp]').forEach(x => x.setAttribute('aria-pressed', x === c));
  }
  savePrefs(); render();
});
document.getElementById('curFilters').addEventListener('click', ev => {
  const c = ev.target.closest('.chip'); if(!c) return;
  const cu = c.dataset.cur;
  if(cu === '__all__'){
    S.curs.clear();
  }else{
    S.curs.has(cu) ? S.curs.delete(cu) : S.curs.add(cu);
  }
  buildCurFilters();
  savePrefs(); render();
});
document.getElementById('tzBtn').addEventListener('click', () => {
  S.tz = S.tz === 'device' ? 'tehran' : 'device';
  document.getElementById('tzTxt').textContent = S.tz === 'tehran' ? 'وقت تهران' : 'وقت دستگاه';
  savePrefs(); render();
});
document.getElementById('refBtn').addEventListener('click', () => boot(true));
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && Date.now() - S.last > 15*60*1000) boot(false);
});

/* ===================== boot ===================== */
function buildCurFilters(){
  const order = ['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD','CNY','All'];
  const seen = [...new Set(S.events.map(e => e.country))]
    .sort((a,b) => (order.indexOf(a)+99)%100 - (order.indexOf(b)+99)%100);
  const allBtn = '<button class="chip all-cur" data-cur="__all__" aria-pressed="'+(S.curs.size===0)+'">همه ارزها</button>';
  const curBtns = seen.map(c =>
    '<button class="chip cur" data-cur="'+c+'" aria-pressed="'+S.curs.has(c)+'"><i>'+(FLAG[c]||'')+'</i>'+c+'</button>'
  ).join('');
  document.getElementById('curFilters').innerHTML = allBtn + curBtns;
}

function syncChips(){
  document.querySelectorAll('#scopeFilters .seg-btn[data-scope]')
    .forEach(x => x.setAttribute('aria-pressed', x.dataset.scope === S.scope));
  document.querySelectorAll('#scopeFilters .seg-btn[data-imp]')
    .forEach(x => x.setAttribute('aria-pressed', x.dataset.imp === S.imp));
  document.getElementById('tzTxt').textContent = S.tz === 'tehran' ? 'وقت تهران' : 'وقت دستگاه';
  document.getElementById('viewTxt').textContent = S.view === 'table' ? 'کارت' : 'جدول';
}

async function boot(manual){
  const btn = document.getElementById('refBtn');
  if(manual && Date.now() - S.last < 30*1000) return;
  btn.disabled = true;
  try{
    const data = await loadEvents();
    S.events = data.sort((a,b) => new Date(a.date) - new Date(b.date));
    S.last = Date.now();
    buildCurFilters(); render(); showSource();
  }catch(err){
    document.getElementById('list').innerHTML =
      '<div class="state"><b>تقویم نیامد</b>هیچ‌کدام از منبع‌ها جواب ندادند ('+esc(err.message)+').</div>';
  }
  btn.disabled = false;
}

function showSource(){
  const el = document.getElementById('upd');
  if(!el) return;
  if(S.src === 'live'){
    el.textContent = ' · مستقیم از فارکس‌فکتوری، همین الان';
    return;
  }
  if(S.src === 'cache'){
    el.textContent = ' · آفلاین: آخرین نسخه‌ی ذخیره‌شده در مرورگر';
    return;
  }
  if(S.src === 'fallback'){
    el.textContent = ' · داده تقویم هفته جاری';
    return;
  }
  if(S.src === 'repo'){
    el.textContent = ' · به‌روزرسانی خودکار هر ساعت';
    fetch('./updated.json?t=' + Math.floor(Date.now()/6e5), {cache:'no-store'})
      .then(r => r.ok ? r.json() : null)
      .then(o => {
        if(!o || !o.updated) return;
        const m = Math.round((Date.now() - new Date(o.updated))/6e4);
        el.textContent = ' · آخرین به‌روزرسانی: ' +
          (m < 60 ? m + ' دقیقه پیش' : Math.round(m/60) + ' ساعت پیش');
      }).catch(() => {});
  }
}

/* ---------- مدیریت تم (روشن / تیره / خودکار) ---------- */
const LIGHT = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
const THEME_FA = {light:'روشن', dark:'تیره', auto:'خودکار'};

function applyTheme(){
  const resolved = S.theme === 'auto' ? (LIGHT && LIGHT.matches ? 'light' : 'dark') : S.theme;
  document.documentElement.dataset.theme = resolved;
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', resolved === 'light' ? '#f4f1ea' : '#13161c');
  document.getElementById('themeTxt').textContent = THEME_FA[S.theme];
  const icon = document.getElementById('themeIcon');
  if(icon){
    icon.innerHTML = resolved === 'light'
      ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
      : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
  document.querySelectorAll('.topt').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.theme === S.theme));
}
if(LIGHT && LIGHT.addEventListener)
  LIGHT.addEventListener('change', () => { if(S.theme === 'auto') applyTheme(); });

const themeBtn = document.getElementById('themeBtn');
const themePop = document.getElementById('themePop');
function closeTheme(){ themePop.hidden = true; themeBtn.setAttribute('aria-expanded','false'); }
themeBtn.addEventListener('click', e => {
  e.stopPropagation();
  const open = themePop.hidden;
  themePop.hidden = !open;
  themeBtn.setAttribute('aria-expanded', String(open));
});
themePop.addEventListener('click', e => {
  const b = e.target.closest('.topt'); if(!b) return;
  S.theme = b.dataset.theme;
  savePrefs(); applyTheme(); closeTheme();
});
document.addEventListener('click', e => { if(!e.target.closest('.tw')) closeTheme(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeTheme(); });

if('serviceWorker' in navigator){
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

loadPrefs(); applyTheme(); syncChips(); boot(false);
setInterval(() => { if(!document.hidden) boot(false); }, 15*60*1000);
</script>
</body>
</html>
