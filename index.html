<script>

  var m=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches;
  document.documentElement.dataset.theme = (t==='auto' ? (m?'light':'dark') : t);

<style>
:root{
  /* جوهر گرم — نه آبی، نه مشکی مطلق */
  --ink:#121317; --ink-deep:#0b0c0e;
  --card:#1a1c22; --card-2:#20232a;
  --line:#282c35; --line-soft:#1f2229; --rail:#262a33;
  --paper:#eceae6; --mist:#9b9da6; --faint:#6b6e78;

  --ember:#e2564c; --marigold:#e0a140; --steel:#6e8ba8;
  --t-high:rgba(226,86,76,.11); --t-med:rgba(224,161,64,.085);
  --b-high:rgba(226,86,76,.34); --b-med:rgba(224,161,64,.26);
  --up:#4fbf9b; --down:#e2647a;
  --t-high-h:rgba(226,86,76,.17); --t-med-h:rgba(224,161,64,.14);
  --t-high-s:rgba(226,86,76,.22); --ring-high:rgba(226,86,76,.2);
  --gold:#e0b452; --gold-hi:#f7e2a8; --gold-lo:#b8862a;
  --gold-soft:rgba(224,180,82,.13); --gold-line:rgba(224,180,82,.34);
  --line-strong:#39404d; --header-bg:rgba(18,19,23,.9);
  --det-bg:rgba(11,12,14,.55); --body-text:#cfd2d8; --bg-glow:#191b21;
  --shadow:rgba(0,0,0,.6);

  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --clock:"Poetsen One","IBM Plex Mono",ui-monospace,monospace;
}
:root[data-theme="light"]{
  --ink:#f6f4f0; --ink-deep:#ece9e2; --bg-glow:#fffdf9;
  --card:#ffffff; --card-2:#f2efe9;
  --line:#e1ddd4; --line-soft:#eae6de; --rail:#ded9cf; --line-strong:#c9c3b7;
  --paper:#1b1c20; --mist:#63666e; --faint:#8e9099;
  --ember:#c8402f; --marigold:#a8720f; --steel:#4c6f92;
  --t-high:rgba(200,64,47,.07); --t-med:rgba(168,114,15,.08);
  --b-high:rgba(200,64,47,.3); --b-med:rgba(168,114,15,.28);
  --t-high-h:rgba(200,64,47,.13); --t-med-h:rgba(168,114,15,.14);
  --t-high-s:rgba(200,64,47,.16); --ring-high:rgba(200,64,47,.18);
  --gold:#96690c; --gold-hi:#c09429; --gold-lo:#704e08;
  --gold-soft:rgba(150,105,12,.11); --gold-line:rgba(150,105,12,.3);
  --up:#0f8f6c; --down:#c2415a;
  --header-bg:rgba(246,244,240,.92); --det-bg:rgba(0,0,0,.035);
  --body-text:#33353b; --shadow:rgba(60,50,35,.22);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  background-image:radial-gradient(120% 60% at 50% 0%,var(--bg-glow) 0%,var(--ink) 45%,var(--ink-deep) 100%);
  background-attachment:fixed;
  color:var(--paper);
  font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;
  font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
  padding-bottom:44px;
}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}
:where(.iconbtn,.chip,.ev,tr.row):focus-visible{outline:2px solid var(--marigold);outline-offset:2px}

/* ---------- سربرگ ---------- */
header{position:sticky;top:0;z-index:30;background:var(--header-bg);
  backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line-soft)}
.head-row{display:flex;align-items:center;gap:7px;padding:12px 0 10px}
.brand{margin-inline-end:auto;line-height:1.15}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:7px}
.brand b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ember);
  box-shadow:0 0 0 3px rgba(226,86,76,.16)}
.brand span{font-size:10.5px;color:var(--faint);letter-spacing:.2px}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--mist);border-radius:10px;
  padding:6px 11px;font-family:inherit;font-size:11.5px;cursor:pointer;transition:.15s}
.iconbtn:hover{color:var(--paper);border-color:var(--line-strong);background:var(--card)}
.iconbtn:disabled{opacity:.4}
.tw{position:relative;display:inline-flex}
.themepop{position:absolute;top:calc(100% + 7px);inset-inline-end:0;z-index:40;
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:5px;
  min-width:140px;display:flex;flex-direction:column;gap:2px;
  box-shadow:0 14px 34px -14px var(--shadow)}
.themepop[hidden]{display:none}
.topt{background:transparent;border:0;color:var(--mist);font-family:inherit;font-size:12.5px;
  text-align:start;padding:8px 10px;border-radius:9px;cursor:pointer;
  display:flex;align-items:center;gap:9px;transition:.12s}
.topt:hover{background:var(--card-2);color:var(--paper)}
.topt::before{content:"";width:7px;height:7px;border-radius:50%;flex:0 0 auto;
  border:1px solid var(--faint);background:transparent}
.topt[aria-selected="true"]{color:var(--paper)}
.topt[aria-selected="true"]::before{background:var(--marigold);border-color:var(--marigold)}
.topt small{margin-inline-start:auto;font-size:10px;color:var(--faint)}

/* ---------- خبر بعدی ---------- */
.next{display:flex;align-items:center;gap:11px;background:var(--card);
  border:1px solid var(--line-soft);border-radius:14px;padding:12px 13px;margin:14px 0 12px}
.next.hi{background:var(--t-high);border:1px solid var(--ember);box-shadow:0 0 0 1px var(--ring-high)}
.next.md{background:var(--t-med);border-color:var(--b-med);border-inline-start:3px solid var(--marigold)}
.next.lo{border-inline-start:3px solid var(--rail)}
.next .lbl{font-size:10.5px;color:var(--faint);letter-spacing:.2px}
.next .ttl{font-weight:700;font-size:15.5px;margin-top:3px;line-height:1.45}
.next .cd{font-family:var(--clock);color:var(--paper);
  font-size:clamp(17px,5vw,23px);font-weight:400;direction:ltr;white-space:nowrap;
  font-variant-numeric:tabular-nums;letter-spacing:.5px;line-height:1.1;
  width:5.9em;text-align:start;flex:0 0 auto;margin-inline-end:16px}
.next .bulls{display:flex;align-items:center;gap:4px;flex:0 0 auto;margin-inline-start:auto}
.bull{width:23px;height:20px;flex:0 0 auto;fill:none;stroke:var(--faint);
  stroke-width:3.2;stroke-linejoin:round}
.bull.on{fill:var(--ember);stroke:none}
.next.hi.soon{background:var(--t-high-s);border-color:var(--ember);box-shadow:0 0 0 2px var(--ring-high)}

/* ---------- فیلترها ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;padding:3px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--mist);
  border-radius:999px;padding:5px 13px;font-family:inherit;font-size:12px;cursor:pointer;
  white-space:nowrap;transition:.15s}
.chip:hover{color:var(--paper)}
.chip[aria-pressed="true"]{background:var(--card-2);color:var(--paper);border-color:var(--line-strong)}
.chip.cur[aria-pressed="true"]{color:var(--marigold);border-color:var(--b-med);background:var(--t-med)}

/* ---------- روز و ریل زمان ---------- */
#list{position:relative}
.day{position:sticky;top:55px;z-index:20;display:flex;align-items:baseline;gap:9px;
  padding:16px 0 9px;background:var(--ink);background-image:linear-gradient(var(--ink),var(--ink))}
.day b{font-size:12.5px;font-weight:700;letter-spacing:.2px}
.day span{font-size:11px;color:var(--faint);font-family:var(--mono)}
.day i{flex:1;height:1px;background:var(--line-soft)}
.nowline{position:relative;z-index:1;display:flex;align-items:center;gap:9px;margin:1px 0 9px}
.nowline b{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ember);
  direction:ltr;font-variant-numeric:tabular-nums}
.nowline i{flex:1;height:1px;background:linear-gradient(to left,var(--ember),rgba(226,86,76,.04))}

/* ---------- کارت ---------- */
.ev{position:relative;z-index:1;width:100%;text-align:start;background:var(--card);
  border:1px solid var(--line-soft);border-radius:14px;padding:11px 13px;margin-bottom:9px;
  color:inherit;font-family:inherit;display:grid;grid-template-columns:50px 1fr;gap:0 12px;
  cursor:pointer;transition:border-color .15s,background .15s,opacity .2s}
.ev:hover{border-color:var(--line-strong)}
.ev.past{opacity:.38}
.ev.hi{background:var(--t-high);border:1px solid var(--ember);box-shadow:0 0 0 1px var(--ring-high)}
.ev.md{background:var(--t-med);border-color:var(--b-med);border-inline-start:3px solid var(--marigold)}
.ev.lo{border-inline-start:3px solid var(--rail)}
.ev.hi:hover{background:var(--t-high-h)}
.ev.md:hover{background:var(--t-med-h)}
.ev.hi.soon{background:var(--t-high-s);border-color:var(--ember);box-shadow:0 0 0 2px var(--ring-high)}
.ev.hi.soon .rel{color:var(--ember)}
.chev{position:absolute;inset-inline-end:10px;top:11px;color:var(--faint);font-size:10px;
  line-height:1;transition:transform .18s;pointer-events:none}
.ev[aria-expanded="true"] .chev{transform:rotate(180deg);color:var(--paper)}
.tcol{display:flex;flex-direction:column;gap:2px}
.tcol .t{font-family:var(--mono);font-size:15px;font-weight:600;direction:ltr;
  font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.tcol .rel{font-size:9.5px;color:var(--faint);white-space:nowrap}
.cur{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.4px;
  background:var(--card-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--mist)}
.ev-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.en{font-size:10px;color:var(--faint);direction:ltr;text-align:start;letter-spacing:.1px}
.fa{font-size:15.5px;font-weight:700;margin-top:3px;line-height:1.45;padding-inline-end:14px}
.why{font-size:12.5px;color:var(--mist);margin-top:3px;line-height:1.65}
.vals{display:flex;gap:15px;margin-top:8px;font-size:10.5px;color:var(--faint)}
.vals b{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--paper);
  direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}
.vals .up b{color:var(--up)} .vals .down b{color:var(--down)}
.body{grid-column:1/-1;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft);
  font-size:13.5px;color:var(--body-text);line-height:1.8}
.body h4{margin:0 0 3px;font-size:10px;color:var(--marigold);font-weight:700;letter-spacing:.6px}
.body p{margin:0 0 11px} .body p:last-child{margin-bottom:0}

/* ---------- نمای جدولی ---------- */
.calhead{display:flex;align-items:center;gap:10px;background:var(--card-2);border:1px solid var(--line);
  border-bottom:0;border-radius:14px 14px 0 0;padding:11px 15px}
.calhead b{font-size:14px;letter-spacing:-.2px}
.calhead span{margin-inline-start:auto;font-size:11px;color:var(--mist);font-family:var(--mono);direction:ltr}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:0 0 14px 14px;
  background:var(--card);-webkit-overflow-scrolling:touch}
table.cal{width:100%;min-width:340px;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
table.cal.has-actual{min-width:430px}
table.cal .w-t{width:50px} table.cal .w-c{width:56px}
table.cal .w-i{width:32px} table.cal .w-n{width:58px}
table.cal th{background:var(--card-2);color:var(--faint);font-size:10px;font-weight:700;
  letter-spacing:.4px;padding:9px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
table.cal td{padding:10px 4px;text-align:center;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.cal tr.row{cursor:pointer}
table.cal tr.row:hover td{background:var(--card-2)}
table.cal tr.hi td{background:var(--t-high)}
table.cal tr.md td{background:var(--t-med)}
table.cal tr.hi.soon td{background:var(--t-high-s)}
table.cal tr.hi:hover td{background:var(--t-high-h)}
table.cal tr.md:hover td{background:var(--t-med-h)}
table.cal tr.past td{opacity:.4}
table.cal tr.hi td:first-child{box-shadow:inset 3px 0 0 var(--ember)}
table.cal tr.md td:first-child{box-shadow:inset 3px 0 0 var(--marigold)}
tr.dayrow td{background:var(--ink);font-weight:700;font-size:12px;text-align:start;
  padding:10px 14px;color:var(--paper)}
tr.dayrow span{color:var(--faint);font-family:var(--mono);font-size:11px;margin-inline-start:8px}
td.ttd{font-family:var(--mono);font-weight:600;direction:ltr;white-space:nowrap;font-size:13px;
  font-variant-numeric:tabular-nums}
td.curtd{white-space:nowrap;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--mist);
  overflow:hidden}
td.curtd i{font-style:normal;font-size:14px;margin-inline-end:3px;vertical-align:-1px}
td.evt{text-align:start;font-weight:600;line-height:1.55;padding-inline:8px;overflow-wrap:anywhere}
td.evt small{display:block;font-weight:400;color:var(--faint);font-size:9.5px;direction:ltr;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.evt .chev-t{color:var(--faint);font-size:9px;margin-inline-start:5px}
tr[data-open="1"] td.evt .chev-t{color:var(--paper)}
td.numtd{font-family:var(--mono);direction:ltr;white-space:nowrap;color:var(--mist);font-size:11.5px;
  font-variant-numeric:tabular-nums;letter-spacing:-.2px}
td.numtd.up{color:var(--up)} td.numtd.down{color:var(--down)}
.imp{display:inline-flex;gap:3px;direction:ltr}
.imp span{width:5px;height:5px;border-radius:50%;background:var(--rail)}
.imp.hi span.on{background:var(--ember)}
.imp.md span.on{background:var(--marigold)}
.imp.lo span.on{background:var(--faint)}
tr.det td{text-align:start;background:var(--det-bg);padding:13px 15px}
tr.det .body{margin:0;padding:0;border:0}

/* ---------- حالت‌های خالی ---------- */
.state{text-align:center;padding:52px 18px;color:var(--mist);font-size:13.5px;line-height:1.9}
.state b{display:block;color:var(--paper);margin-bottom:7px;font-size:15px}
.note{font-size:11px;color:var(--faint);text-align:center;padding:20px 8px 5px;line-height:2}
.credit{font-size:11px;color:var(--faint);text-align:center;padding:0 8px 20px;margin:0}
.credit b{color:var(--mist);font-weight:600}
.ver{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-inline-start:7px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    <path d="M32 15.5C27.5 15.5 24 16.2 21.6 17.4L11 26C13 30 15 32.4 17 34.4C18.6 38 20.4 41.4 23 44.4C25.4 47.2 28.4 51.5 32 51.5C35.6 51.5 38.6 47.2 41 44.4C43.6 41.4 45.4 38 47 34.4C49 32.4 51 30 53 26L42.4 17.4C40 16.2 36.5 15.5 32 15.5Z"/>
    <path d="M2 4C1 15 6.4 24.6 17.6 28C18.8 24 19.4 20.6 22.4 17C14.6 15.8 7.6 11.6 2 4Z"/>

    </symbol>
</svg>

<header>
  <div class="wrap head-row">
    <div class="brand"><b>رادار خبر</b><span>تقویم اقتصادی فارکس‌فکتوری</span></div>
    <button class="iconbtn" id="viewBtn">جدول</button>
    <span class="tw">
      <button class="iconbtn" id="themeBtn" aria-expanded="false">خودکار</button>
      <div class="themepop" id="themePop" hidden>
        <button class="topt" data-theme="light">روشن</button>
        <button class="topt" data-theme="dark">تیره</button>
        <button class="topt" data-theme="auto">خودکار<small>مثل گوشی</small></button>
      </div>
    </span>
    <button class="iconbtn" id="tzBtn">وقت دستگاه</button>
    <button class="iconbtn" id="refBtn">تازه‌سازی</button>
  </div>
</header>

<div class="wrap">
  <div id="nextBox"></div>
  <div class="filters" id="scopeFilters">
    <button class="chip" data-scope="today">امروز</button>
    <button class="chip" data-scope="week" aria-pressed="true">کل هفته</button>
    <button class="chip" data-imp="high">فقط پرتأثیر</button>
    <button class="chip" data-imp="med" aria-pressed="true">متوسط و بالا</button>
    <button class="chip" data-imp="all">همه</button>
  </div>
  <div class="filters" id="curFilters"></div>
  <div id="list"><div class="state">در حال گرفتن تقویم هفته…</div></div>
  <p class="note">داده از فید هفتگی Forex Factory · توضیح‌ها آموزشی‌اند، نه سیگنال<span id="upd"></span></p>
  <p class="credit">طراحی و توسعه: <b>علی نظری</b><span class="ver">v2.1</span></p>
</div>

<script>
/* ============ دیکشنری فارسی رویدادها: [نام, این چیه و چرا مهمه, اثر بالاتر از انتظار] ============ */
const D = {
"cpi":["شاخص قیمت مصرف‌کننده","تورم مصرف‌کننده؛ اصلی‌ترین ورودی تصمیم نرخ بهره بانک مرکزی.","تورم داغ‌تر → انتظار نرخ بهره بالاتر → تقویت ارز و فشار فروش روی طلا."],
"core cpi":["شاخص قیمت مصرف‌کننده هسته","تورم بدون خوراک و انرژی؛ بانک‌های مرکزی بیشتر به همین نگاه می‌کنند.","بالاتر از انتظار → سیاست انقباضی‌تر → ارز قوی‌تر، طلا زیر فشار."],
"cpi flash estimate":["برآورد اولیه تورم","اولین تخمین تورم منطقه یورو؛ زودتر از رقم نهایی بازار را حرکت می‌دهد.","بالاتر از انتظار → یورو قوی‌تر."],
"trimmed mean cpi":["تورم میانگین تعدیل‌شده","معیار تورم پایدارِ موردنظر بانک مرکزی استرالیا.","بالاتر از انتظار → احتمال نرخ بهره بالاتر → تقویت ارز."],
"ppi":["شاخص قیمت تولیدکننده","تورم در سطح تولید؛ پیش‌نشانه تورم مصرف‌کننده.","بالاتر از انتظار → انتظار تورم بیشتر → تقویت ارز."],
"core ppi":["شاخص قیمت تولیدکننده هسته","تورم تولید بدون اقلام پرنوسان.","بالاتر از انتظار → ارز قوی‌تر."],
"pce price index":["شاخص قیمت مخارج مصرف شخصی","معیار تورم موردعلاقه فدرال‌رزرو.","بالاتر از انتظار → دلار قوی‌تر، طلا زیر فشار."],

"wage price index":["شاخص دستمزد","رشد دستمزدها؛ ورودی مهم تورم.","بالاتر از انتظار → تقویت ارز."],

/* پیشوندهای منطقه‌ای و پسوندهای دوره‌ای */
const REGION = {german:"آلمان",french:"فرانسه",italian:"ایتالیا",spanish:"اسپانیا",belgian:"بلژیک",
  dutch:"هلند",greek:"یونان",swiss:"سوئیس",tokyo:"توکیو",national:"سراسری",german_:"آلمان"};
const QUAL = {prelim:"مقدماتی",flash:"اولیه",final:"نهایی",revised:"بازبینی‌شده",advance:"پیشاپیش",
  "second estimate":"برآورد دوم","third estimate":"برآورد سوم",monthly:"ماهانه",weekly:"هفتگی",annual:"سالانه"};
const PERIOD = {"m/m":"ماهانه","y/y":"سالانه","q/q":"فصلی","q/y":"فصلی-سالانه","w/w":"هفتگی"};

function lookup(title){
  let t = title.toLowerCase().trim();
  let pre = [], per = "";

  const pm = t.match(/\s(m\/m|y\/y|q\/q|q\/y|w\/w)$/);
  if(pm){ per = PERIOD[pm[1]]; t = t.slice(0, pm.index).trim(); }

  // پیشوند منطقه‌ای
  for(const r in REGION){
    if(t.startsWith(r + " ")){ pre.push(REGION[r]); t = t.slice(r.length+1); break; }
  }
  // پیشوند کیفی (مقدماتی/نهایی/…)
  for(const q in QUAL){
    if(t.startsWith(q + " ")){ pre.push(QUAL[q]); t = t.slice(q.length+1); break; }
  }

  let hit = D[t];

  // الگوهای عمومی
  if(!hit && /\bspeaks$/.test(t)){
    const who = title.replace(/\s+speaks$/i,'');
    return {fa:"سخنرانی " + who, why:"لحن و اشاره به مسیر نرخ بهره می‌تواند بازار را حرکت دهد.",
            eff:"لحن انقباضی معمولاً ارز را تقویت و طلا را تضعیف می‌کند."};
  }
  if(!hit && /bond auction$/.test(t)){
    return {fa:"حراج اوراق قرضه" + (pre.length ? " " + pre.join(" ") : ""),
            why:"بازده و تقاضای اوراق دولتی؛ سنجه اشتهای ریسک و انتظار تورم.",
            eff:"بازده بالاتر → فشار روی طلا و سهام."};
  }
  if(!hit && /holiday$/.test(t)){
    return {fa:"تعطیلی بازار" + (pre.length ? " " + pre.join(" ") : ""),
            why:"بازار آن کشور تعطیل است؛ نقدشوندگی پایین و اسپرد بالا.",
            eff:"نوسان‌های بی‌پشتوانه محتمل است؛ معامله محتاطانه."};
  }
  if(!hit) return null;

  const label = (pre.length ? pre.join(" ") + " — " : "") + hit[0] + (per ? " (" + per + ")" : "");
  return {fa:label, why:hit[1], eff:hit[2]};
}

/* ===================== state ===================== */
const S = {events:[], imp:'med', scope:'week', curs:new Set(), tz:'device', view:'cards',
           theme:'auto', open:new Set(), last:0, src:''};
const FLAG = {USD:"🇺🇸",EUR:"🇪🇺",GBP:"🇬🇧",JPY:"🇯🇵",CHF:"🇨🇭",CAD:"🇨🇦",AUD:"🇦🇺",NZD:"🇳🇿",CNY:"🇨🇳",All:"🌐"};
const key = e => e.title + '|' + e.country + '|' + e.date;

/* ===================== data ===================== */
const FEED = 'https://nfs.faireconomy.media/ff_calendar_thisweek.json';
/* فایل ریپو که Actions هر ساعت تازه‌اش می‌کند؛ مستقیم‌ها فقط اگر آن نبود */
const SOURCES = [
  {s:'repo', u:() => './calendar.json?t=' + Math.floor(Date.now()/6e5)},
  {s:'live', u:() => FEED},
  {s:'live', u:() => 'https://cdn-nfs.faireconomy.media/ff_calendar_thisweek.json'},
  {s:'live', u:() => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(FEED)},
  {s:'live', u:() => 'https://corsproxy.io/?url=' + encodeURIComponent(FEED)}
];
async function loadEvents(){
  let err;
  for(const src of SOURCES){
    try{
      const r = await fetch(src.u(), {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const txt = await r.text();
      const a = txt.indexOf('[');
      if(a < 0) throw new Error('پاسخ نامعتبر');
      const data = JSON.parse(txt.slice(a, txt.lastIndexOf(']')+1));
      if(!Array.isArray(data) || !data.length) throw new Error('خالی');
      S.src = src.s;
      save(data);
      return data.filter(e => e && e.date && e.title);
    }catch(e){ err = e; }
  }
  const cached = restore();
  if(cached){ S.src = 'cache'; return cached; }
  throw err || new Error('در دسترس نیست');
}
/* کش محلی: اگر شبکه نبود، همان داده هفته را نشان بده */
function save(d){ try{ localStorage.setItem('ffcal', JSON.stringify({t:Date.now(), d})); }catch(e){} }
function restore(){
  try{
    const o = JSON.parse(localStorage.getItem('ffcal') || 'null');
    if(o && Date.now() - o.t < 8*864e5) return o.d;
  }catch(e){}
  return null;
}
function loadPrefs(){
  try{
    const p = JSON.parse(localStorage.getItem('ffprefs') || 'null');
    if(p){ S.imp = p.imp || S.imp; S.scope = p.scope || S.scope; S.tz = p.tz || S.tz;
           S.view = p.view || S.view; S.theme = p.theme || S.theme;
           S.curs = new Set(p.curs || []); }
  }catch(e){}
}
function savePrefs(){
  try{ localStorage.setItem('ffprefs', JSON.stringify(
    {imp:S.imp, scope:S.scope, tz:S.tz, view:S.view, theme:S.theme, curs:[...S.curs]})); }catch(e){}
}

/* ===================== time ===================== */
const tzOpt = () => S.tz === 'tehran' ? {timeZone:'Asia/Tehran'} : {};
const fmtTime = d => new Intl.DateTimeFormat('en-GB', Object.assign({hour:'2-digit',minute:'2-digit',hour12:false}, tzOpt())).format(d);
const dayKey = d => new Intl.DateTimeFormat('en-CA', Object.assign({year:'numeric',month:'2-digit',day:'2-digit'}, tzOpt())).format(d);
const weekday = d => new Intl.DateTimeFormat('fa-IR', Object.assign({weekday:'long'}, tzOpt())).format(d);
const dateFa = d => new Intl.DateTimeFormat('fa-IR-u-nu-latn', Object.assign({day:'numeric',month:'long'}, tzOpt())).format(d);

function relTime(ms){
  const m = Math.round(Math.abs(ms)/60000);
  if(m < 1) return 'همین حالا';
  const h = Math.floor(m/60), d = Math.floor(h/24);
  let s = d >= 1 ? d + ' روز' : h >= 1 ? h + ' ساعت' : m + ' دقیقه';
  return ms > 0 ? s + ' دیگر' : s + ' پیش';
}
function countdown(ms){
  if(ms <= 0) return 'شروع شد';
  const t = Math.floor(ms/1000), p = n => String(n).padStart(2,'0');
  const d = Math.floor(t/86400), h = Math.floor(t%86400/3600), m = Math.floor(t%3600/60), s = t%60;
  return d ? d + 'd ' + p(h) + ':' + p(m) : p(h) + ':' + p(m) + ':' + p(s);
}

/* ===================== filters ===================== */
const rank = i => i === 'High' ? 3 : i === 'Medium' ? 2 : 1;
function passes(e){
  const r = rank(e.impact);
  if(S.imp === 'high' && r < 3) return false;
  if(S.imp === 'med' && r < 2) return false;
  if(S.curs.size && !S.curs.has(e.country)) return false;
  if(S.scope === 'today' && dayKey(new Date(e.date)) !== dayKey(new Date())) return false;
  return true;
}

/* ===================== render ===================== */
const esc = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const impClass = i => i === 'High' ? 'hi' : i === 'Medium' ? 'md' : 'lo';
const num = v => parseFloat(String(v).replace(/[^0-9.\-]/g,''));

function valsHTML(e){
  const out = [];
  if(e.actual){
    const f = num(e.forecast), a = num(e.actual);
    const cls = (!isNaN(f) && !isNaN(a)) ? (a > f ? 'up' : a < f ? 'down' : '') : '';
    out.push('<span class="'+cls+'">واقعی <b>'+esc(e.actual)+'</b></span>');
  }
  if(e.forecast) out.push('<span>پیش‌بینی <b>'+esc(e.forecast)+'</b></span>');
  if(e.previous) out.push('<span>قبلی <b>'+esc(e.previous)+'</b></span>');
  return out.length ? '<div class="vals">'+out.join('')+'</div>' : '';
}

function bodyHTML(e, info){
  let html = '';
  if(info){
    html += '<h4>این خبر چیست</h4><p>'+esc(info.why)+'</p>';
    html += '<h4>اثر روی بازار</h4><p>'+esc(info.eff)+'</p>';
  }else{
    html += '<p>این رویداد در دیکشنری نیست. عنوان انگلیسی‌اش را در فارکس‌فکتوری ببین.</p>';
  }
  if(e.forecast && e.previous){
    const f = num(e.forecast), p = num(e.previous);
    if(!isNaN(f) && !isNaN(p)){
      const dir = f > p ? 'بهتر از دوره قبل' : f < p ? 'ضعیف‌تر از دوره قبل' : 'هم‌سطح دوره قبل';
      html += '<h4>انتظار بازار</h4><p>بازار رقمی '+dir+' انتظار دارد ('+esc(e.previous)+' → '+esc(e.forecast)+'). '+
              'انحراف از پیش‌بینی است که حرکت می‌سازد، نه خودِ عدد.</p>';
    }
  }
  if(rank(e.impact) === 3){
    html += '<h4>نکته اجرایی</h4><p>در دقایق اطراف این خبر اسپرد باز می‌شود و استاپ‌ها راحت شکار می‌شوند. '+
            'اگر پوزیشن باز داری، حجم و استاپ را قبلش تنظیم کن.</p>';
  }
  return html;
}

function render(){
  if(S.view === 'table') renderTable(); else renderCards();
  renderNext();
}

function renderCards(){
  const list = document.getElementById('list');
  const evs = S.events.filter(passes);
  if(!evs.length){
    list.innerHTML = '<div class="state"><b>خبری با این فیلترها نیست</b>فیلتر اهمیت یا بازه را بازتر کن.</div>';
    return;
  }
  const now = Date.now(), today = dayKey(new Date()), tmr = dayKey(new Date(Date.now()+864e5));
  let html = '', cur = '', nowIns = false;
  for(const e of evs){
    const d = new Date(e.date), dk = dayKey(d);
    if(dk !== cur){
      cur = dk;
      const lbl = dk === today ? 'امروز' : dk === tmr ? 'فردا' : weekday(d);
      html += '<div class="day"><b>'+lbl+'</b><span>'+dateFa(d)+'</span><i></i></div>';
    }
    if(!nowIns && dk === today && d.getTime() > now){
      html += '<div class="nowline"><b data-now>'+fmtTime(new Date())+'</b><i></i></div>';
      nowIns = true;
    }
    const k = key(e), info = lookup(e.title), open = S.open.has(k), diff = d.getTime()-now;
    const soon = rank(e.impact) === 3 && diff > 0 && diff < 60*60*1000 ? ' soon' : '';
    html += '<button class="ev '+impClass(e.impact)+soon+(diff < -36e5 ? ' past':'')+'" data-k="'+esc(k)+'" aria-expanded="'+open+'">'+
      '<span class="chev">\u25BE</span>'+
      '<div class="tcol"><span class="t">'+fmtTime(d)+'</span><span class="rel" data-cd="'+d.getTime()+'">'+relTime(diff)+'</span></div>'+
      '<div><div class="ev-head"><span class="cur">'+esc(e.country)+'</span><span class="en">'+esc(e.title)+'</span></div>'+
      '<div class="fa">'+esc(info ? info.fa : e.title)+'</div>'+
      (info ? '<div class="why">'+esc(info.why)+'</div>' : '')+
      valsHTML(e)+'</div>'+
      (open ? '<div class="body">'+bodyHTML(e, info)+'</div>' : '')+'</button>';
  }
  list.innerHTML = html;
}

function impDots(imp){
  const cls = impClass(imp), n = rank(imp);
  let s = '<span class="imp '+cls+'">';
  for(let i=1;i<=3;i++) s += '<span'+(i <= n ? ' class="on"' : '')+'></span>';
  return s + '</span>';
}

function renderTable(){
  const list = document.getElementById('list');
  const evs = S.events.filter(passes);
  if(!evs.length){
    list.innerHTML = '<div class="state"><b>خبری با این فیلترها نیست</b>فیلتر اهمیت یا بازه را بازتر کن.</div>';
    return;
  }
  const now = Date.now(), today = dayKey(new Date()), tmr = dayKey(new Date(Date.now()+864e5));
  const hasActual = evs.some(e => e.actual);
  const cols = hasActual ? 7 : 6;

  let rows = '', cur = '';
  for(const e of evs){
    const d = new Date(e.date), dk = dayKey(d);
    if(dk !== cur){
      cur = dk;
      const lbl = dk === today ? 'امروز' : dk === tmr ? 'فردا' : weekday(d);
      rows += '<tr class="dayrow"><td colspan="'+cols+'">'+lbl+'<span>'+dateFa(d)+'</span></td></tr>';
    }
    const k = key(e), info = lookup(e.title), diff = d.getTime()-now;
    let actTd = '';
    if(hasActual){
      let cls = '';
      if(e.actual){
        const f = num(e.forecast), a = num(e.actual);
        if(!isNaN(f) && !isNaN(a)) cls = a > f ? ' up' : a < f ? ' down' : '';
      }
      actTd = '<td class="numtd'+cls+'">'+esc(e.actual || '–')+'</td>';
    }
    rows += '<tr class="row '+impClass(e.impact)+
      (rank(e.impact) === 3 && diff > 0 && diff < 60*60*1000 ? ' soon' : '')+
      (diff < -36e5 ? ' past':'')+'" data-k="'+esc(k)+'" data-open="'+(S.open.has(k)?'1':'0')+'">'+
      '<td class="ttd">'+fmtTime(d)+'</td>'+
      '<td class="curtd"><i>'+(FLAG[e.country] || '')+'</i>'+esc(e.country)+'</td>'+
      '<td>'+impDots(e.impact)+'</td>'+
      '<td class="evt">'+esc(info ? info.fa : e.title)+'<span class="chev-t">\u25BE</span><small>'+esc(e.title)+'</small></td>'+
      '<td class="numtd">'+esc(e.previous || '–')+'</td>'+
      '<td class="numtd">'+esc(e.forecast || '–')+'</td>'+
      actTd + '</tr>';
    if(S.open.has(k))
      rows += '<tr class="det"><td colspan="'+cols+'"><div class="body">'+bodyHTML(e, info)+'</div></td></tr>';
  }

  const anchor = new Date(S.scope === 'today' ? Date.now() : evs[0].date);
  list.innerHTML =
    '<div class="calhead"><b>تقویم اقتصادی</b>'+
      '<span>'+weekday(anchor)+' · '+dateFa(anchor)+'</span></div>'+
    '<div class="tablewrap"><table class="cal'+(hasActual ? ' has-actual' : '')+'"><thead><tr>'+
      '<th class="w-t">زمان</th><th class="w-c">ارز</th><th class="w-i">اهمیت</th>'+
      '<th>رویداد</th><th class="w-n">قبلی</th><th class="w-n">پیش‌بینی</th>'+
      (hasActual ? '<th class="w-n">واقعی</th>' : '')+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function bulls(imp){
  const n = rank(imp);
  let out = '<span class="bulls">';
  for(let i=1;i<=3;i++)
    out += '<svg class="bull'+(i <= n ? ' on' : '')+'" viewBox="0 0 24 20"><use href="#bull"/></svg>';
  return out + '</span>';
}

function renderNext(){
  const box = document.getElementById('nextBox'), now = Date.now();
  const n = S.events.filter(e => rank(e.impact) >= 2 && new Date(e.date).getTime() > now)
                    .sort((a,b) => new Date(a.date)-new Date(b.date))[0];
  if(!n){ box.innerHTML = ''; return; }
  const t = new Date(n.date).getTime(), info = lookup(n.title);
  const soonCls = (rank(n.impact) === 3 && t-now < 36e5) ? ' soon' : '';
  box.innerHTML = '<div class="next '+impClass(n.impact)+soonCls+'"><div>'+
    '<div class="lbl">خبر مهم بعدی · '+esc(n.country)+' · '+fmtTime(new Date(t))+'</div>'+
    '<div class="ttl">'+esc(info ? info.fa : n.title)+'</div></div>'+
    bulls(n.impact)+
    '<div class="cd" data-cd-big="'+t+'">'+countdown(t-now)+'</div></div>';
}

setInterval(() => {
  const now = Date.now();
  document.querySelectorAll('[data-cd]').forEach(el => el.textContent = relTime(+el.dataset.cd - now));
  const b = document.querySelector('[data-cd-big]');
  if(b) b.textContent = countdown(+b.dataset.cdBig - now);
  const nw = document.querySelector('[data-now]');
  if(nw) nw.textContent = fmtTime(new Date());
}, 1000);

/* ===================== interactions ===================== */

  const el = ev.target.closest('.ev, tr.row'); if(!el) return;
  const k = el.dataset.k;
  S.open.has(k) ? S.open.delete(k) : S.open.add(k);

});

  S.view = S.view === 'cards' ? 'table' : 'cards';
  e.target.textContent = S.view === 'table' ? 'کارت' : 'جدول';

});
document.getElementById('scopeFilters').addEventListener('click', ev => {

  if(c.dataset.scope){
    S.scope = c.dataset.scope;
    document.querySelectorAll('#scopeFilters .chip[data-scope]').forEach(x => x.setAttribute('aria-pressed', x === c));
  }else{
    S.imp = c.dataset.imp;
    document.querySelectorAll('#scopeFilters .chip[data-imp]').forEach(x => x.setAttribute('aria-pressed', x === c));

  savePrefs(); render();
});
document.getElementById('curFilters').addEventListener('click', ev => {
  const c = ev.target.closest('.chip'); if(!c) return;
  const cu = c.dataset.cur;
  S.curs.has(cu) ? S.curs.delete(cu) : S.curs.add(cu);
  c.setAttribute('aria-pressed', S.curs.has(cu));
  savePrefs(); render();
});
document.getElementById('tzBtn').addEventListener('click', e => {
  S.tz = S.tz === 'device' ? 'tehran' : 'device';
  e.target.textContent = S.tz === 'tehran' ? 'وقت تهران' : 'وقت دستگاه';
  savePrefs(); render();
});
document.getElementById('refBtn').addEventListener('click', () => boot(true));
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && Date.now() - S.last > 15*60*1000) boot(false);
});

/* ===================== boot ===================== */
function buildCurFilters(){
  const order = ['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD','CNY','All'];
  const seen = [...new Set(S.events.map(e => e.country))]
    .sort((a,b) => (order.indexOf(a)+99)%100 - (order.indexOf(b)+99)%100);
  document.getElementById('curFilters').innerHTML = seen.map(c =>
    '<button class="chip cur" data-cur="'+c+'" aria-pressed="'+S.curs.has(c)+'">'+c+'</button>').join('');
}
function syncChips(){
  document.querySelectorAll('#scopeFilters .chip[data-scope]')
    .forEach(x => x.setAttribute('aria-pressed', x.dataset.scope === S.scope));
  document.querySelectorAll('#scopeFilters .chip[data-imp]')
    .forEach(x => x.setAttribute('aria-pressed', x.dataset.imp === S.imp));
  document.getElementById('tzBtn').textContent = S.tz === 'tehran' ? 'وقت تهران' : 'وقت دستگاه';
  document.getElementById('viewBtn').textContent = S.view === 'table' ? 'کارت' : 'جدول';
}

async function boot(manual){
  const btn = document.getElementById('refBtn');
  if(manual && Date.now() - S.last < 30*1000){
    btn.textContent = 'چند دقیقه صبر';
    setTimeout(() => btn.textContent = 'تازه‌سازی', 2000);
    return;
  }
  btn.disabled = true; btn.textContent = 'گرفتن…';
  try{
    const data = await loadEvents();
    S.events = data.sort((a,b) => new Date(a.date) - new Date(b.date));
    S.last = Date.now();
    buildCurFilters(); render(); showSource();
  }catch(err){
    document.getElementById('list').innerHTML =
      '<div class="state"><b>تقویم نیامد</b>هیچ‌کدام از منبع‌ها جواب ندادند ('+esc(err.message)+'). '+
      'اگر ورک‌فلوی گیت‌هاب را اجرا کرده باشی، فایل calendar.json باید کنار index.html در ریپو باشد.</div>';
  }
  btn.disabled = false; btn.textContent = 'تازه‌سازی';
}

/* نمایش اینکه داده از کجا آمد */
function showSource(){
  const el = document.getElementById('upd');
  if(!el) return;
  if(S.src === 'live'){
    el.textContent = ' · مستقیم از فارکس‌فکتوری، همین الان';
    return;
  }
  if(S.src === 'cache'){
    el.textContent = ' · آفلاین: آخرین نسخه‌ی ذخیره‌شده در همین مرورگر';
    return;
  }
  if(S.src === 'repo'){
    el.textContent = ' · به‌روزرسانی خودکار هر ساعت';
    fetch('./updated.json?t=' + Math.floor(Date.now()/6e5), {cache:'no-store'})
      .then(r => r.ok ? r.json() : null)
      .then(o => {
        if(!o || !o.updated) return;
        const m = Math.round((Date.now() - new Date(o.updated))/6e4);
        el.textContent = ' · آخرین به‌روزرسانی: ' +
          (m < 60 ? m + ' دقیقه پیش' : Math.round(m/60) + ' ساعت پیش');
      }).catch(() => {});
  }
}

/* ---------- تم ---------- */
const LIGHT = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
const THEME_FA = {light:'روشن', dark:'تیره', auto:'خودکار'};

function applyTheme(){
  const resolved = S.theme === 'auto' ? (LIGHT && LIGHT.matches ? 'light' : 'dark') : S.theme;
  document.documentElement.dataset.theme = resolved;
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', resolved === 'light' ? '#f6f4f0' : '#121317');
  document.getElementById('themeBtn').textContent = THEME_FA[S.theme];
  document.querySelectorAll('.topt').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.theme === S.theme));
}
if(LIGHT && LIGHT.addEventListener)
  LIGHT.addEventListener('change', () => { if(S.theme === 'auto') applyTheme(); });

const themeBtn = document.getElementById('themeBtn');
const themePop = document.getElementById('themePop');
function closeTheme(){ themePop.hidden = true; themeBtn.setAttribute('aria-expanded','false'); }
themeBtn.addEventListener('click', e => {
  e.stopPropagation();
  const open = themePop.hidden;
  themePop.hidden = !open;
  themeBtn.setAttribute('aria-expanded', String(open));
});
themePop.addEventListener('click', e => {
  const b = e.target.closest('.topt'); if(!b) return;
  S.theme = b.dataset.theme;
  savePrefs(); applyTheme(); closeTheme();
});
document.addEventListener('click', e => { if(!e.target.closest('.tw')) closeTheme(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeTheme(); });

/* نصب روی صفحه‌ی اصلی */
if('serviceWorker' in navigator){
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

loadPrefs(); applyTheme(); syncChips(); boot(false);
setInterval(() => { if(!document.hidden) boot(false); }, 15*60*1000);
</script>
</body>
</html>
