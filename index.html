<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>فارکس فکتوری — تقویم اقتصادی</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230F172A'/%3E%3Cpath d='M14 44h7V30h-7zm14.5 0h7V18h-7zM43 44h7V25h-7z' fill='%23F43F5E'/%3E%3Ccircle cx='46.5' cy='15' r='4.5' fill='%23F59E0B'/%3E%3C/svg%3E">
<script>
(function(){
  var t='auto', l='fa';
  try{
    var p=JSON.parse(localStorage.getItem('ffprefs')||'null');
    if(p&&p.theme) t=p.theme;
    if(p&&p.lang) l=p.lang;
  }catch(e){}
  var m=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches;
  document.documentElement.dataset.theme = (t==='auto' ? (m?'light':'dark') : t);
  document.documentElement.lang = l;
  document.documentElement.dir = (l==='en' ? 'ltr' : 'rtl');
})();
</script>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* پالت استاندارد تیره (Slate Dark — کنتراست بالا و استاندارد WCAG AAA/AA بدون طوسیِ بی‌روح روی مشکی) */
  --bg:#0F172A;
  --bg-deep:#0B1120;
  --bg-glow:#1E293B;
  --surface:#1E293B;
  --surface-2:#283548;
  --surface-3:#334155;
  --border:#334155;
  --border-soft:#263346;
  --border-strong:#475569;

  /* متن‌های کاملاً خوانا و روشن روی پس‌زمینه سرمه‌ای تیره */
  --text:#F8FAFC;
  --text-sec:#E2E8F0;
  --text-muted:#CBD5E1;
  --body-text:#F1F5F9;

  /* رنگ‌های معنایی هماهنگ در تم تیره */
  --hi:#FB7185;
  --hi-bg:rgba(244,63,94,.13);
  --hi-bg-hover:rgba(244,63,94,.20);
  --hi-border:rgba(251,113,133,.42);
  --hi-ring:rgba(251,113,133,.25);

  --md:#FBBF24;
  --md-bg:rgba(245,158,11,.12);
  --md-bg-hover:rgba(245,158,11,.18);
  --md-border:rgba(251,191,36,.38);

  --lo:#94A3B8;
  --lo-bg:rgba(148,163,184,.12);

  --up:#34D399;
  --up-bg:rgba(16,185,129,.15);
  --down:#FB7185;
  --down-bg:rgba(244,63,94,.15);

  --accent:#38BDF8;
  --accent-soft:rgba(56,189,248,.16);
  --accent-border:rgba(56,189,248,.42);

  --header-bg:rgba(15,23,42,.88);
  --det-bg:rgba(11,17,32,.65);
  --shadow:0 12px 28px -10px rgba(2,6,23,.65);
  --bull-off:#475569;

  --font-fa:"Vazirmatn",Tahoma,system-ui,sans-serif;
  --font-en:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

:root[data-theme="light"]{
  /* پالت استاندارد روشن (Clean Cool Alabaster & Slate — هماهنگ با تم تیره و کنتراست عالی) */
  --bg:#F1F5F9;
  --bg-deep:#E2E8F0;
  --bg-glow:#F8FAFC;
  --surface:#FFFFFF;
  --surface-2:#F1F5F9;
  --surface-3:#E2E8F0;
  --border:#CBD5E1;
  --border-soft:#E2E8F0;
  --border-strong:#94A3B8;

  /* متن‌های سرمه‌ای تیره با خوانایی فوق‌العاده */
  --text:#0F172A;
  --text-sec:#1E293B;
  --text-muted:#475569;
  --body-text:#1E293B;

  --hi:#E11D48;
  --hi-bg:rgba(225,29,72,.07);
  --hi-bg-hover:rgba(225,29,72,.12);
  --hi-border:rgba(225,29,72,.32);
  --hi-ring:rgba(225,29,72,.16);

  --md:#D97706;
  --md-bg:rgba(217,119,6,.08);
  --md-bg-hover:rgba(217,119,6,.13);
  --md-border:rgba(217,119,6,.32);

  --lo:#64748B;
  --lo-bg:rgba(100,116,139,.1);

  --up:#059669;
  --up-bg:rgba(5,150,105,.11);
  --down:#E11D48;
  --down-bg:rgba(225,29,72,.11);

  --accent:#0284C7;
  --accent-soft:rgba(2,132,199,.12);
  --accent-border:rgba(2,132,199,.36);

  --header-bg:rgba(241,245,249,.9);
  --det-bg:#F8FAFC;
  --shadow:0 10px 24px -8px rgba(15,23,42,.09);
  --bull-off:#CBD5E1;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:radial-gradient(120% 70% at 50% 0%,var(--bg-glow) 0%,var(--bg) 55%,var(--bg-deep) 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-fa);
  font-size:14.5px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  padding-bottom:48px;
  transition:background-color .2s ease,color .2s ease;
}
html[lang="en"] body{
  font-family:var(--font-en);
}
/* در حالت فارسی فونت اعداد هم Vazirmatn باشد تا ارقام فارسی یکدست و هم‌عرض نمایش داده شوند */
html[lang="fa"]{
  --num-font:var(--font-fa);
}
html[lang="en"]{
  --num-font:var(--mono);
}

.wrap{max-width:660px;margin:0 auto;padding:0 14px}
:where(.iconbtn,.seg-btn,.chip,.ev,tr.row):focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* ---------- سربرگ ---------- */
header{
  position:sticky;
  top:0;
  z-index:30;
  background:var(--header-bg);
  backdrop-filter:blur(16px) saturate(1.25);
  -webkit-backdrop-filter:blur(16px) saturate(1.25);
  border-bottom:1px solid var(--border);
}
.head-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:11px 0;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.brand-logo{
  width:36px;
  height:36px;
  border-radius:11px;
  background:var(--surface);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.brand-logo svg{width:21px;height:21px}
.brand-txt{line-height:1.25}
.brand-txt b{
  font-size:17.5px;
  font-weight:800;
  letter-spacing:-.3px;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--text);
}
.live-dot{
  width:7.5px;
  height:7.5px;
  border-radius:50%;
  background:var(--hi);
  box-shadow:0 0 0 3px var(--hi-ring);
  display:inline-block;
}
.brand-txt span{
  font-size:11.5px;
  font-weight:500;
  color:var(--text-muted);
  display:block;
}
.toolbar{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:nowrap;
}
.iconbtn{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-sec);
  border-radius:10px;
  height:35px;
  padding:0 10px;
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  transition:all .15s ease;
  white-space:nowrap;
}
.iconbtn svg{
  width:15px;
  height:15px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex:0 0 auto;
}
.iconbtn:hover{
  color:var(--text);
  border-color:var(--border-strong);
  background:var(--surface-2);
}
.iconbtn:active{transform:scale(.97)}
.iconbtn:disabled{opacity:.45;cursor:default}
.iconbtn.icon-only{width:35px;padding:0}
.iconbtn.lang-btn{
  background:var(--accent-soft);
  border-color:var(--accent-border);
  color:var(--text);
  font-weight:700;
  min-width:42px;
}

/* منوی انتخاب تم */
.tw{position:relative;display:inline-flex}
.themepop{
  position:absolute;
  top:calc(100% + 7px);
  inset-inline-end:0;
  z-index:40;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:13px;
  padding:5px;
  min-width:152px;
  display:flex;
  flex-direction:column;
  gap:2px;
  box-shadow:var(--shadow);
}
.themepop[hidden]{display:none}
.topt{
  background:transparent;
  border:0;
  color:var(--text-sec);
  font-family:inherit;
  font-size:12.5px;
  font-weight:600;
  text-align:start;
  padding:8px 10px;
  border-radius:9px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  transition:.12s;
}
.topt:hover{background:var(--surface-2);color:var(--text)}
.topt::before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  flex:0 0 auto;
  border:1.5px solid var(--text-muted);
  background:transparent;
}
.topt[aria-selected="true"]{
  color:var(--text);
  background:var(--surface-2);
  font-weight:700;
}
.topt[aria-selected="true"]::before{
  background:var(--accent);
  border-color:var(--accent);
}
.topt small{margin-inline-start:auto;font-size:10.5px;color:var(--text-muted);font-weight:500}

/* ---------- کارت خبر مهم بعدی ---------- */
.next{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px 17px;
  margin:14px 0 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:all .2s ease;
}
.next::before{
  content:"";
  position:absolute;
  inset-inline-start:0;
  top:0;
  bottom:0;
  width:4.5px;
  background:var(--border-strong);
}
.next.hi{
  background:linear-gradient(135deg,var(--hi-bg) 0%,var(--surface) 88%);
  border-color:var(--hi-border);
}
.next.hi::before{background:var(--hi)}
.next.md{
  background:linear-gradient(135deg,var(--md-bg) 0%,var(--surface) 88%);
  border-color:var(--md-border);
}
.next.md::before{background:var(--md)}
.next.hi.soon{
  box-shadow:0 0 0 2px var(--hi-ring),var(--shadow);
}

.next-info{
  flex:1;
  min-width:0;
}
.next-meta{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:6px;
}
.next-badge{
  font-size:11.5px;
  font-weight:700;
  color:var(--text-sec);
  background:var(--surface-2);
  padding:2px 9px;
  border-radius:6px;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.next.hi .next-badge{color:var(--hi);background:var(--hi-bg);border:1px solid var(--hi-border)}
.next.md .next-badge{color:var(--md);background:var(--md-bg);border:1px solid var(--md-border)}
.next-cur{
  font-family:var(--mono);
  font-size:11.5px;
  font-weight:700;
  background:var(--surface-2);
  border:1px solid var(--border);
  padding:2px 8px;
  border-radius:6px;
  color:var(--text);
  display:inline-flex;
  align-items:center;
  gap:4px;
  direction:ltr;
}
.next-time{
  font-family:var(--num-font);
  font-size:12.5px;
  font-weight:600;
  color:var(--text-sec);
  font-variant-numeric:tabular-nums;
}
.next-title{
  font-weight:800;
  font-size:16.5px;
  line-height:1.45;
  color:var(--text);
  margin:0;
}
.next-en{
  font-size:11.5px;
  font-weight:500;
  color:var(--text-muted);
  direction:ltr;
  text-align:start;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:3px;
}

.next-side{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  flex:0 0 auto;
}

/* آیکون‌های سر گاو (Bulls) */
.bulls{
  display:inline-flex;
  align-items:center;
  gap:4px;
  direction:ltr;
}
.bull{
  width:27px;
  height:20px;
  flex:0 0 auto;
  fill:var(--bull-off);
  transition:transform .15s ease,fill .15s ease;
}
.next .bulls{gap:8px;justify-content:center}
.next .bull{
  width:44px;
  height:32px;
}
.bulls.hi .bull.on{
  fill:var(--hi);
  filter:drop-shadow(0 1px 3px rgba(244,63,94,.3));
}
.bulls.md .bull.on{
  fill:var(--md);
  filter:drop-shadow(0 1px 3px rgba(245,158,11,.26));
}
.bulls.lo .bull.on{
  fill:var(--lo);
}
.bulls.sm{gap:2.5px}
.bulls.sm .bull{width:19px;height:14px}

/* شمارشگر دیجیتال سگمنت‌شده (Countdown) */
.cd-box{
  display:inline-flex;
  align-items:center;
  gap:4px;
  direction:ltr;
  font-family:var(--num-font);
  font-variant-numeric:tabular-nums;
}
.cd-seg{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:10px;
  min-width:48px;
  padding:6px 8px 4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.1);
}
.next.hi .cd-seg{
  border-color:var(--hi-border);
  background:var(--surface);
}
.cd-val{
  font-size:20px;
  font-weight:800;
  line-height:1.1;
  color:var(--text);
  letter-spacing:.3px;
}
.next.hi.soon .cd-val{color:var(--hi)}
.cd-lbl{
  font-family:inherit;
  font-size:10px;
  font-weight:600;
  color:var(--text-muted);
  margin-top:3px;
  line-height:1;
}
.cd-sep{
  font-weight:800;
  font-size:17px;
  color:var(--text-muted);
  margin-top:-8px;
}
.cd-now{
  background:var(--hi-bg);
  border:1px solid var(--hi-border);
  color:var(--hi);
  font-size:13px;
  font-weight:700;
  padding:6px 13px;
  border-radius:9px;
}


/* ---------- پنل ابزارهای رادار بازار (Sessions / Strength / Correlation) ---------- */
.mradar-wrap{
  margin-bottom:14px;
}
.mradar-toggle-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:8px 11px;
  box-shadow:var(--shadow);
}
.mradar-tabs{
  display:flex;
  align-items:center;
  gap:5px;
  overflow-x:auto;
  scrollbar-width:none;
  flex:1;
}
.mradar-tabs::-webkit-scrollbar{display:none}
.mtab{
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text-sec);
  font-family:inherit;
  font-size:12px;
  font-weight:700;
  padding:6px 11px;
  border-radius:9px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  transition:all .15s ease;
}
.mtab:hover{color:var(--text);border-color:var(--border-strong)}
.mtab[aria-selected="true"]{
  background:var(--accent-soft);
  color:var(--text);
  border-color:var(--accent-border);
}
.mtab .dot-ind{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--up);
  box-shadow:0 0 0 2px var(--up-bg);
}
.mradar-body{
  margin-top:8px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:15px;
  padding:14px 15px;
  box-shadow:var(--shadow);
}
.mradar-body[hidden]{display:none}
.mhead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:11px;
}
.mhead b{font-size:14px;font-weight:800;color:var(--text)}
.mhead span{font-size:11.5px;font-weight:600;color:var(--text-muted)}

/* ۱) سشن‌های فارکس */
.sess-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}
.sess-card{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:11px;
  padding:10px 12px;
  display:flex;
  flex-direction:column;
  gap:5px;
  position:relative;
  overflow:hidden;
}
.sess-card.open{
  border-color:rgba(52,211,153,.45);
  background:linear-gradient(135deg,var(--up-bg) 0%,var(--surface-2) 90%);
}
.sess-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}
.sess-name{
  font-size:13px;
  font-weight:800;
  color:var(--text);
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.sess-badge{
  font-size:10.5px;
  font-weight:700;
  padding:1px 7px;
  border-radius:99px;
  background:var(--surface-3);
  color:var(--text-muted);
}
.sess-card.open .sess-badge{
  background:var(--up-bg);
  color:var(--up);
  border:1px solid rgba(52,211,153,.35);
}
.sess-hours{
  font-family:var(--num-font);
  font-size:12px;
  font-weight:700;
  color:var(--text-sec);
  font-variant-numeric:tabular-nums;
}
.sess-sub{
  font-size:11px;
  font-weight:600;
  color:var(--text-muted);
}
.sess-bar{
  height:4px;
  background:var(--surface-3);
  border-radius:99px;
  overflow:hidden;
  margin-top:2px;
}
.sess-bar i{
  display:block;
  height:100%;
  background:var(--up);
  border-radius:99px;
}
.overlap-banner{
  margin-top:10px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:8px 12px;
  font-size:12px;
  font-weight:600;
  color:var(--text-sec);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}
.overlap-banner.hot{
  background:var(--md-bg);
  border-color:var(--md-border);
  color:var(--text);
}
.overlap-banner b{color:var(--md);font-weight:800}

/* ۲) دماسنج قدرت ارزها (MarketMilk) + عملکرد روزانه (Finviz) */
.str-mode-bar{
  display:inline-flex;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:2px;
  gap:2px;
}
.str-mode-btn{
  background:transparent;
  border:0;
  color:var(--text-sec);
  font-family:inherit;
  font-size:11px;
  font-weight:700;
  padding:3px 9px;
  border-radius:6px;
  cursor:pointer;
}
.str-mode-btn[aria-pressed="true"]{
  background:var(--surface);
  color:var(--text);
  box-shadow:0 1px 3px rgba(0,0,0,.18);
}
.str-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.str-row{
  display:grid;
  grid-template-columns:64px 1fr 56px;
  align-items:center;
  gap:10px;
  background:var(--surface-2);
  border:1px solid var(--border-soft);
  border-radius:9px;
  padding:6px 10px;
}
.str-cur{
  font-family:var(--mono);
  font-size:12px;
  font-weight:700;
  color:var(--text);
  display:inline-flex;

const REGION = {german:"آلمان",french:"فرانسه",italian:"ایتالیا",spanish:"اسپانیا",belgian:"بلژیک",
  dutch:"هلند",greek:"یونان",swiss:"سوئیس",tokyo:"توکیو",national:"سراسری",german_:"آلمان"};
const QUAL = {prelim:"مقدماتی",flash:"اولیه",final:"نهایی",revised:"بازبینی‌شده",advance:"پیشاپیش",
  "second estimate":"برآورد دوم","third estimate":"برآورد سوم",monthly:"ماهانه",weekly:"هفتگی",annual:"سالانه"};
const PERIOD = {"m/m":"ماهانه","y/y":"سالانه","q/q":"فصلی","q/y":"فصلی-سالانه","w/w":"هفتگی"};

function lookup(title){
  let t = title.toLowerCase().trim();
  let pre = [], per = "";

  const pm = t.match(/\s(m\/m|y\/y|q\/q|q\/y|w\/w)$/);
  if(pm){ per = PERIOD[pm[1]]; t = t.slice(0, pm.index).trim(); }

  for(const r in REGION){
    if(t.startsWith(r + " ")){ pre.push(REGION[r]); t = t.slice(r.length+1); break; }
  }
  for(const q in QUAL){
    if(t.startsWith(q + " ")){ pre.push(QUAL[q]); t = t.slice(q.length+1); break; }
  }

  let hit = D[t];

  if(!hit && /\bspeaks$/.test(t)){
    const who = title.replace(/\s+speaks$/i,'');
    return {fa:"سخنرانی " + who, why:"لحن و اشاره به مسیر نرخ بهره می‌تواند بازار را حرکت دهد.",
            eff:"لحن انقباضی معمولاً ارز را تقویت و طلا را تضعیف می‌کند."};
  }
  if(!hit && /bond auction$/.test(t)){
    return {fa:"حراج اوراق قرضه" + (pre.length ? " " + pre.join(" ") : ""),
            why:"بازده و تقاضای اوراق دولتی؛ سنجه اشتهای ریسک و انتظار تورم.",
            eff:"بازده بالاتر → فشار روی طلا و سهام."};
  }
  if(!hit && /holiday$/.test(t)){
    return {fa:"تعطیلی بازار" + (pre.length ? " " + pre.join(" ") : ""),
            why:"بازار آن کشور تعطیل است؛ نقدشوندگی پایین و اسپرد بالا.",
            eff:"نوسان‌های بی‌پشتوانه محتمل است؛ معامله محتاطانه."};
  }
  if(!hit) return null;

  const label = (pre.length ? pre.join(" — ") + " — " : "") + hit[0] + (per ? " (" + per + ")" : "");
  return {fa:label, why:hit[1], eff:hit[2]};
}

  {s:'live', u:() => FEED},

  {s:'live', u:() => 'https://corsproxy.io/?url=' + encodeURIComponent(FEED)}
];

async function loadEvents(){
  for(const src of SOURCES){
    try{
      const r = await fetch(src.u(), {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const txt = await r.text();
      const a = txt.indexOf('[');
      if(a < 0) throw new Error('Invalid response');
      const data = JSON.parse(txt.slice(a, txt.lastIndexOf(']')+1));
      if(!Array.isArray(data) || !data.length) throw new Error('Empty');
      S.src = src.s;
      save(data);
      return data.filter(e => e && e.date && e.title);
    }catch(e){}
  }
  const cached = restore();
  if(cached){ S.src = 'cache'; return cached; }
  S.src = 'fallback';
  return FALLBACK_EVENTS;
}

function save(d){ try{ localStorage.setItem('ffcal', JSON.stringify({t:Date.now(), d})); }catch(e){} }
function restore(){
  try{
    const o = JSON.parse(localStorage.getItem('ffcal') || 'null');
    if(o && Date.now() - o.t < 8*864e5) return o.d;
  }catch(e){}
  return null;
}

      S.theme = p.theme || S.theme;

}

const dayKey = d => new Intl.DateTimeFormat('en-CA', Object.assign({year:'numeric',month:'2-digit',day:'2-digit'}, tzOpt())).format(d);
const weekdayFa = d => new Intl.DateTimeFormat('fa-IR', Object.assign({weekday:'long'}, tzOpt())).format(d);
const dateFa = d => toFaNum(new Intl.DateTimeFormat('fa-IR-u-nu-latn', Object.assign({day:'numeric',month:'long'}, tzOpt())).format(d));
const dateEnFull = d => new Intl.DateTimeFormat('en-US', Object.assign({weekday:'long',month:'short',day:'numeric'}, tzOpt())).format(d);
const dateEnShort = d => new Intl.DateTimeFormat('en-GB', Object.assign({weekday:'short',day:'numeric',month:'short'}, tzOpt())).format(d);

function dayRelLabel(dk){
  const now = Date.now(), L = UI[S.lang];
  if(dk === dayKey(new Date(now))) return {txt:L.today, cls:'today'};
  if(dk === dayKey(new Date(now + 864e5))) return {txt:L.tomorrow, cls:''};
  if(dk === dayKey(new Date(now - 864e5))) return {txt:L.yesterday, cls:''};
  return null;
}

function relTime(ms){
  const m = Math.round(Math.abs(ms)/60000);
  if(S.lang === 'en'){
    if(m < 1) return 'Just now';
    const h = Math.floor(m/60), d = Math.floor(h/24);
    const s = d >= 1 ? d + 'd' : h >= 1 ? h + 'h' : m + 'm';
    return ms > 0 ? 'in ' + s : s + ' ago';
  }
  if(m < 1) return 'همین حالا';
  const h = Math.floor(m/60), d = Math.floor(h/24);
  let s = d >= 1 ? toFaNum(d) + ' روز' : h >= 1 ? toFaNum(h) + ' ساعت' : toFaNum(m) + ' دقیقه';
  return ms > 0 ? s + ' دیگر' : s + ' پیش';
}

function countdownHTML(ms){
  const L = UI[S.lang];
  if(ms <= 0) return '<span class="cd-now">'+L.releasing+'</span>';
  const t = Math.floor(ms/1000), p = n => locNum(String(n).padStart(2,'0'));
  const d = Math.floor(t/86400), h = Math.floor(t%86400/3600), m = Math.floor(t%3600/60), s = t%60;
  if(d > 0){
    return '<div class="cd-box">' +
      '<div class="cd-seg"><span class="cd-val">'+p(d)+'</span><span class="cd-lbl">'+L.day+'</span></div>' +
      '<span class="cd-sep">:</span>' +
      '<div class="cd-seg"><span class="cd-val">'+p(h)+'</span><span class="cd-lbl">'+L.hour+'</span></div>' +
      '<span class="cd-sep">:</span>' +
      '<div class="cd-seg"><span class="cd-val">'+p(m)+'</span><span class="cd-lbl">'+L.min+'</span></div>' +
    '</div>';
  }
  return '<div class="cd-box">' +
    '<div class="cd-seg"><span class="cd-val">'+p(h)+'</span><span class="cd-lbl">'+L.hour+'</span></div>' +
    '<span class="cd-sep">:</span>' +
    '<div class="cd-seg"><span class="cd-val">'+p(m)+'</span><span class="cd-lbl">'+L.min+'</span></div>' +
    '<span class="cd-sep">:</span>' +
    '<div class="cd-seg"><span class="cd-val">'+p(s)+'</span><span class="cd-lbl">'+L.sec+'</span></div>' +
  '</div>';
}

/* ===================== filters ===================== */
const isHoliday = i => i === 'Holiday';
const rank = i => (i === 'High' || isHoliday(i)) ? 3 : i === 'Medium' ? 2 : 1;
function passes(e){
  const r = rank(e.impact);
  if(S.imp === 'high' && r < 3) return false;
  if(S.imp === 'med' && r < 2) return false;
  if(S.curs.size && !S.curs.has(e.country)) return false;
  if(S.scope === 'today' && dayKey(new Date(e.date)) !== dayKey(new Date())) return false;
  return true;
}

/* ===================== render ===================== */
const esc = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const impClass = i => (i === 'High' || isHoliday(i)) ? 'hi' : i === 'Medium' ? 'md' : 'lo';
const num = v => parseFloat(String(v).replace(/[^0-9.\-]/g,''));

function bullsHTML(imp, small){
  const n = rank(imp), cls = impClass(imp) + (small ? ' sm' : '');
  let out = '<span class="bulls '+cls+'" aria-label="Impact '+esc(imp)+'">';
  for(let i=1;i<=3;i++){
    out += '<svg class="bull'+(i <= n ? ' on' : '')+'" viewBox="0 0 100 73.3"><use href="#bull"/></svg>';
  }
  return out + '</span>';
}

function valsHTML(e){
  const out = [], L = UI[S.lang];
  if(e.actual){
    const f = num(e.forecast), a = num(e.actual);
    const cls = (!isNaN(f) && !isNaN(a)) ? (a > f ? ' up' : a < f ? ' down' : '') : '';
    out.push('<span class="val-pill'+cls+'">'+L.actual+' <b>'+esc(locNum(e.actual))+'</b></span>');
  }
  if(e.forecast) out.push('<span class="val-pill">'+L.forecast+' <b>'+esc(locNum(e.forecast))+'</b></span>');
  if(e.previous) out.push('<span class="val-pill">'+L.previous+' <b>'+esc(locNum(e.previous))+'</b></span>');
  return out.length ? '<div class="vals">'+out.join('')+'</div>' : '';
}

function pairEffectFa(cur, strong){
  const dir = strong ? 'صعودی' : 'نزولی';
  const opp = strong ? 'نزولی' : 'صعودی';
  switch(cur){
    case 'USD':
      return strong
        ? 'جفت‌ارزهایی مثل <b>USDJPY</b> و <b>USDCAD</b> تمایل به <b>صعود</b> دارند و <b>EURUSD</b>، <b>GBPUSD</b> و <b>طلا (XAUUSD)</b> معمولاً با فشار <b>نزولی</b> روبه‌رو می‌شوند.'
        : 'جفت‌ارزهایی مثل <b>EURUSD</b>، <b>GBPUSD</b> و <b>طلا (XAUUSD)</b> معمولاً تمایل به <b>صعود</b> دارند و <b>USDJPY</b> و <b>USDCAD</b> تحت فشار <b>نزولی</b> قرار می‌گیرند.';
    case 'EUR':
      return 'در نتیجه <b>EURUSD</b>، <b>EURGBP</b> و <b>EURJPY</b> معمولاً تمایل به حرکت <b>'+dir+'</b> دارند.';
    case 'GBP':
      return 'در نتیجه <b>GBPUSD</b> و <b>GBPJPY</b> تمایل به حرکت <b>'+dir+'</b> و <b>EURGBP</b> تمایل به حرکت <b>'+opp+'</b> دارد.';
    case 'JPY':
      return 'در نتیجه <b>USDJPY</b> و <b>EURJPY</b> معمولاً تمایل به حرکت <b>'+opp+'</b> دارند (چون ین ارز دوم جفت‌ارز است).';
    case 'CAD':
      return 'در نتیجه <b>USDCAD</b> معمولاً تمایل به حرکت <b>'+opp+'</b> و <b>CADJPY</b> تمایل به حرکت <b>'+dir+'</b> دارد.';
    case 'CHF':
      return 'در نتیجه <b>USDCHF</b> و <b>EURCHF</b> معمولاً تمایل به حرکت <b>'+opp+'</b> دارند.';
    case 'AUD':
      return 'در نتیجه <b>AUDUSD</b> و <b>AUDJPY</b> معمولاً تمایل به حرکت <b>'+dir+'</b> دارند.';
    case 'NZD':
      return 'در نتیجه <b>NZDUSD</b> و <b>NZDJPY</b> معمولاً تمایل به حرکت <b>'+dir+'</b> دارند.';
    default:
      return 'ارز <b>'+esc(cur)+'</b> در برابر سایر ارزها تمایل به حرکت <b>'+dir+'</b> پیدا می‌کند.';
  }
}

function pairEffectEn(cur, strong){
  const dir = strong ? 'bullish (upward)' : 'bearish (downward)';
  const opp = strong ? 'bearish (downward)' : 'bullish (upward)';
  switch(cur){
    case 'USD':
      return strong
        ? 'Pairs like <b>USDJPY</b> and <b>USDCAD</b> tend to move <b>higher</b>, while <b>EURUSD</b>, <b>GBPUSD</b>, and <b>Gold (XAUUSD)</b> face <b>downward</b> pressure.'
        : '<b>EURUSD</b>, <b>GBPUSD</b>, and <b>Gold (XAUUSD)</b> tend to move <b>higher</b>, while <b>USDJPY</b> and <b>USDCAD</b> face <b>downward</b> pressure.';
    case 'EUR':
      return 'Consequently, <b>EURUSD</b>, <b>EURGBP</b>, and <b>EURJPY</b> typically see <b>'+dir+'</b> momentum.';
    case 'GBP':
      return 'Consequently, <b>GBPUSD</b> and <b>GBPJPY</b> see <b>'+dir+'</b> pressure while <b>EURGBP</b> moves <b>'+opp+'</b>.';
    case 'JPY':
      return 'Consequently, <b>USDJPY</b> and <b>EURJPY</b> typically move <b>'+opp+'</b> (since JPY is the quote currency).';
    case 'CAD':
      return 'Consequently, <b>USDCAD</b> typically moves <b>'+opp+'</b> while <b>CADJPY</b> moves <b>'+dir+'</b>.';
    case 'CHF':
      return 'Consequently, <b>USDCHF</b> and <b>EURCHF</b> typically move <b>'+opp+'</b>.';
    case 'AUD':
      return 'Consequently, <b>AUDUSD</b> and <b>AUDJPY</b> typically see <b>'+dir+'</b> momentum.';
    case 'NZD':
      return 'Consequently, <b>NZDUSD</b> and <b>NZDJPY</b> typically see <b>'+dir+'</b> momentum.';
    default:
      return '<b>'+esc(cur)+'</b> tends to experience <b>'+dir+'</b> pressure against major counterparts.';
  }
}

function isInverseMetric(title){
  const t = String(title || '').toLowerCase();
  return /unemployment rate|unemployment claims|claimant count|unemployment change|challenger job cuts|mortgage delinquencies|jobless/.test(t);
}

function bodyHTML(e, info){
  if(S.lang === 'en') return bodyHTMLEn(e);
  let html = '';
  const cur = esc(e.country || '');
  const tLow = (e.title || '').toLowerCase();

  html += '<h4>این خبر دقیقاً چیست؟</h4>';
  if(info){
    html += '<p>'+esc(toFaNum(info.why))+'</p>';
  }else{
    html += '<p>رویداد اقتصادی مربوط به ارز <b>'+cur+'</b> با عنوان انگلیسی <span dir="ltr">'+esc(e.title)+'</span>. این شاخص وضعیت بخشی از اقتصاد یا سیاست پولی این کشور را گزارش می‌دهد.</p>';
  }

  html += '<h4>انتظار بازار و اثر روی قیمت</h4>';

  if(isHoliday(e.impact)){
    html += '<p>در روزهای تعطیلی بانکی عدد پیش‌بینی یا واقعی منتشر نمی‌شود؛ مهم‌ترین اثر آن کاهش نقدشوندگی و حجم معاملات در سشن مربوط به <b>'+cur+'</b> است.</p>';
    html += '<div class="scen-list"><div class="scen"><b>رفتار معمول قیمت:</b> بازار معمولاً کم‌رمق یا رِنج می‌شود، اما به دلیل خالی بودن دفتر سفارش‌ها، ممکن است اسپایک‌های ناگهانی و اسپرد بالا دیده شود.</div></div>';
  }else if(/\bspeaks$|symposium|minutes|statement|press conference|bulletin|opinions|deliberations|meetings/.test(tLow)){
    html += '<p>این رویداد عددی نیست و بازار به <b>لحن کلام و جهت‌گیری سیاست پولی</b> واکنش نشان می‌دهد (نه به پیش‌بینی عددی).</p>';
    html += '<div class="scen-list">'+
      '<div class="scen bullish"><b class="tag">▲ لحن انقباضی (Hawkish / سخت‌گیرانه):</b> اشاره به نگرانی از تورم یا نیاز به بالا نگه داشتن نرخ بهره ← <b>تقویت '+cur+'</b>؛ '+pairEffectFa(e.country, true)+'</div>'+
      '<div class="scen bearish"><b class="tag">▼ لحن انبساطی (Dovish / نرم):</b> اشاره به ضعف اقتصاد یا احتمال کاهش نرخ بهره ← <b>تضعیف '+cur+'</b>؛ '+pairEffectFa(e.country, false)+'</div>'+
    '</div>';
  }else if(/crude oil inventories|natural gas storage|api weekly/.test(tLow)){
    const asset = tLow.includes('natural gas') ? 'گاز طبیعی' : 'نفت (WTI/Brent)';
    const fcTxt = e.forecast ? 'پیش‌بینی فعلی بازار روی <b>'+esc(toFaNum(e.forecast))+'</b> است. ' : '';
    html += '<p>'+fcTxt+'افزایش غیرمنتظره ذخایر یعنی تقاضا کمتر یا عرضه بیشتر بوده است.</p>';
    html += '<div class="scen-list">'+
      '<div class="scen bearish"><b class="tag">▲ بالاتر از پیش‌بینی:</b> ذخیره بیشتر از انتظار ← فشار <b>نزولی</b> روی قیمت '+asset+(e.country==='USD'?' و معمولاً فشار منفی روی <b>CAD</b> (به‌عنوان ارز نفتی)':'')+'.</div>'+
      '<div class="scen bullish"><b class="tag">▼ پایین‌تر از پیش‌بینی:</b> کاهش ذخیره بیشتر از انتظار ← حمایت <b>صعودی</b> از قیمت '+asset+'.</div>'+
    '</div>';
  }else{
    const inv = isInverseMetric(e.title);
    let intro = '';
    if(e.forecast && e.previous){
      const f = num(e.forecast), p = num(e.previous);
      let cmp = '';
      if(!isNaN(f) && !isNaN(p)){
        cmp = f > p ? ' (بالاتر از عدد قبلی)' : f < p ? ' (پایین‌تر از عدد قبلی)' : ' (بدون تغییر نسبت به دوره قبل)';
      }
      intro = 'عدد دوره قبل <b>'+esc(toFaNum(e.previous))+'</b> بوده و انتظار فعلی بازار (پیش‌بینی) روی <b>'+esc(toFaNum(e.forecast))+'</b>'+cmp+' قرار دارد. ';
    }else if(e.forecast){
      intro = 'پیش‌بینی و انتظار فعلی بازار روی <b>'+esc(toFaNum(e.forecast))+'</b> است. ';
    }else{
      intro = 'واکنش بازار بر اساس مقایسه عدد <b>واقعی (Actual)</b> با <b>پیش‌بینی (Forecast)</b> شکل می‌گیرد. ';
    }
    intro += 'آنچه باعث حرکت تند قیمت می‌شود، <b>اختلاف عدد واقعی با پیش‌بینی</b> است؛ نه خودِ عدد به تنهایی:';
    html += '<p>'+intro+'</p>';

    const fcRef = e.forecast ? ' (بیشتر از '+esc(toFaNum(e.forecast))+')' : '';
    const fcRefLow = e.forecast ? ' (کمتر از '+esc(toFaNum(e.forecast))+')' : '';

    if(!inv){
      html += '<div class="scen-list">'+
        '<div class="scen bullish"><b class="tag">▲ اگر بالاتر از انتظار'+fcRef+' بیاید:</b> یعنی شاخص قوی‌تر از پیش‌بینی است و احتمال سیاست سخت‌گیرانه‌تر بانک مرکزی بالا می‌رود ← <b>تقویت '+cur+'</b>؛ '+pairEffectFa(e.country, true)+'</div>'+
        '<div class="scen bearish"><b class="tag">▼ اگر پایین‌تر از انتظار'+fcRefLow+' بیاید:</b> یعنی داده‌ها ضعیف‌تر از پیش‌بینی بازار است ← <b>تضعیف '+cur+'</b>؛ '+pairEffectFa(e.country, false)+'</div>'+
      '</div>';
    }else{
      html += '<div class="scen-list">'+
        '<div class="scen bearish"><b class="tag">▲ اگر بالاتر از انتظار'+fcRef+' بیاید:</b> در این شاخص عدد بالاتر به معنی <b>وضعیت ضعیف‌تر</b> (بیکاری یا ریسک بیشتر) است ← <b>تضعیف '+cur+'</b>؛ '+pairEffectFa(e.country, false)+'</div>'+
        '<div class="scen bullish"><b class="tag">▼ اگر پایین‌تر از انتظار'+fcRefLow+' بیاید:</b> یعنی شرایط بهتر از پیش‌بینی بازار و بازار کار قوی‌تر است ← <b>تقویت '+cur+'</b>؛ '+pairEffectFa(e.country, true)+'</div>'+
      '</div>';
    }
    if(e.actual){
      html += '<p><b>نتیجه منتشرشده:</b> عدد واقعی <b>'+esc(toFaNum(e.actual))+'</b> ثبت شده است.</p>';
    }
  }

  if(isHoliday(e.impact)){
    html += '<h4>نکته معاملاتی</h4><p>در زمان تعطیلی بانکی از ورود به معاملات اسکالپ روی جفت‌ارزهای <b>'+cur+'</b> خودداری کنید یا حد ضرر را با احتیاط تنظیم کنید.</p>';
  }else if(rank(e.impact) === 3){
    html += '<h4>نکته اجرایی</h4><p>در دقایق قبل و بعد از انتشار این خبر، اسپرد بروکرها باز می‌شود و نوسان رفت‌وبرگشتی (شکار استاپ) زیاد است؛ پیش از خبر حجم و حد ضرر خود را مدیریت کنید.</p>';
  }
  return html;
}

function bodyHTMLEn(e){
  let html = '';
  const cur = esc(e.country || '');
  const tLow = (e.title || '').toLowerCase();

  html += '<h4>What Is This Event?</h4>';
  if(isHoliday(e.impact)){
    html += '<p>Banks and local financial markets in <b>'+cur+'</b> are closed for a public holiday, reducing liquidity during this session.</p>';
  }else if(/cpi|pce|ppi|wpi|inflation/.test(tLow)){
    html += '<p><b>'+esc(e.title)+'</b> measures price changes and inflationary pressure for <b>'+cur+'</b>. Central banks closely watch inflation data when deciding interest rate policy.</p>';
  }else if(/employment|unemployment|payrolls|job|claimant|earnings|wage/.test(tLow)){
    html += '<p><b>'+esc(e.title)+'</b> is a key labor market indicator for <b>'+cur+'</b>. Strong job growth supports consumer spending and hawkish monetary policy.</p>';
  }else if(/gdp|retail sales|pmi|production|orders|sales|trade balance|account/.test(tLow)){
    html += '<p><b>'+esc(e.title)+'</b> tracks economic activity and demand for <b>'+cur+'</b>, acting as a leading gauge of overall economic momentum.</p>';
  }else if(/rate|fomc|ecb|boe|boj|rba|boc|snb|mpc|speaks|minutes|statement/.test(tLow)){
    html += '<p><b>'+esc(e.title)+'</b> communicates central bank policy direction and interest rate outlook for <b>'+cur+'</b>.</p>';
  }else{
    html += '<p>Economic indicator for <b>'+cur+'</b> (<b>'+esc(e.title)+'</b>) reflecting macroeconomic or monetary conditions.</p>';
  }

  html += '<h4>Market Expectation & Price Impact</h4>';
  if(isHoliday(e.impact)){
    html += '<div class="scen-list"><div class="scen"><b>Typical Price Action:</b> Lower liquidity and wider spreads; price often ranges but can experience sudden thin-market spikes.</div></div>';
  }else if(/\bspeaks$|symposium|minutes|statement|press conference|bulletin|opinions|deliberations|meetings/.test(tLow)){
    html += '<p>Traders react to the <b>policy tone (Hawkish vs. Dovish)</b> rather than a single number:</p>';
    html += '<div class="scen-list">'+
      '<div class="scen bullish"><b class="tag">▲ Hawkish Tone (Higher Rates / Inflation Focus):</b> Bullish for <b>'+cur+'</b>. '+pairEffectEn(e.country, true)+'</div>'+
      '<div class="scen bearish"><b class="tag">▼ Dovish Tone (Rate Cuts / Growth Concerns):</b> Bearish for <b>'+cur+'</b>. '+pairEffectEn(e.country, false)+'</div>'+
    '</div>';
  }else if(/crude oil inventories|natural gas storage|api weekly/.test(tLow)){
    const asset = tLow.includes('natural gas') ? 'Natural Gas' : 'Crude Oil (WTI/Brent)';
    html += '<div class="scen-list">'+
      '<div class="scen bearish"><b class="tag">▲ Higher Than Forecast:</b> Larger inventory build signals weaker demand ← <b>Bearish</b> for '+asset+'.</div>'+
      '<div class="scen bullish"><b class="tag">▼ Lower Than Forecast:</b> Larger drawdown signals stronger demand ← <b>Bullish</b> for '+asset+'.</div>'+
    '</div>';
  }else{
    const inv = isInverseMetric(e.title);
    let intro = '';
    if(e.forecast && e.previous){
      intro = 'Previous reading was <b>'+esc(e.previous)+'</b> and market consensus forecast stands at <b>'+esc(e.forecast)+'</b>. ';
    }else if(e.forecast){
      intro = 'Market consensus forecast stands at <b>'+esc(e.forecast)+'</b>. ';
    }
    intro += 'Price volatility is driven by the <b>deviation between Actual and Forecast</b>:';
    html += '<p>'+intro+'</p>';

    const fcHi = e.forecast ? ' (&gt; '+esc(e.forecast)+')' : '';
    const fcLo = e.forecast ? ' (&lt; '+esc(e.forecast)+')' : '';

    if(!inv){
      html += '<div class="scen-list">'+
        '<div class="scen bullish"><b class="tag">▲ Higher Than Forecast'+fcHi+':</b> Stronger economic reading supports hawkish policy ← <b>Bullish for '+cur+'</b>. '+pairEffectEn(e.country, true)+'</div>'+
        '<div class="scen bearish"><b class="tag">▼ Lower Than Forecast'+fcLo+':</b> Weaker reading weighs on rate expectations ← <b>Bearish for '+cur+'</b>. '+pairEffectEn(e.country, false)+'</div>'+
      '</div>';
    }else{
      html += '<div class="scen-list">'+
        '<div class="scen bearish"><b class="tag">▲ Higher Than Forecast'+fcHi+':</b> For this indicator, a higher figure reflects economic slack ← <b>Bearish for '+cur+'</b>. '+pairEffectEn(e.country, false)+'</div>'+
        '<div class="scen bullish"><b class="tag">▼ Lower Than Forecast'+fcLo+':</b> Lower reading signals a tighter labor/credit market ← <b>Bullish for '+cur+'</b>. '+pairEffectEn(e.country, true)+'</div>'+
      '</div>';
    }
  }

  if(rank(e.impact) === 3 && !isHoliday(e.impact)){
    html += '<h4>Execution Note</h4><p>Spreads often widen and stop-hunts (whipsaws) are common in the minutes around high-impact releases. Manage position size and stops beforehand.</p>';
  }
  return html;
}

function fmtUTCWindow(startUTC, endUTC){
  const now = new Date();
  const d1 = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), startUTC, 0, 0));
  const d2 = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), endUTC, 0, 0));
  return fmtTime(d1) + ' – ' + fmtTime(d2);
}

function getSessionState(sess){
  const now = new Date();
  const curMin = now.getUTCHours() * 60 + now.getUTCMinutes();
  const sMin = sess.startUTC * 60, eMin = sess.endUTC * 60;
  const dur = ((eMin - sMin) + 1440) % 1440;
  const elapsed = ((curMin - sMin) + 1440) % 1440;
  const isOpen = elapsed < dur;
  const remMin = isOpen ? (dur - elapsed) : (((sMin - curMin) + 1440) % 1440);
  const h = Math.floor(remMin / 60), m = remMin % 60;
  const pct = isOpen ? Math.min(100, Math.max(4, Math.round((elapsed / dur) * 100))) : 0;
  const timeStr = S.lang === 'fa'
    ? (h > 0 ? toFaNum(h) + ' ساعت و ' + toFaNum(m) + ' دقیقه' : toFaNum(m) + ' دقیقه')
    : (h > 0 ? h + 'h ' + m + 'm' : m + 'm');
  return {isOpen, pct, timeStr};
}

async function fetchLiveFX(){
  try{
    const r = await fetch('https://open.er-api.com/v6/latest/USD', {cache:'no-store'});
    if(!r.ok) return;
    const j = await r.json();
    if(!j || !j.rates) return;
    const rt = j.rates;
    const eur = rt.EUR ? (1/rt.EUR) : 1.1057;
    const gbp = rt.GBP ? (1/rt.GBP) : 1.3246;
    const jpy = rt.JPY || 159.82;
    const cad = rt.CAD || 1.4232;
    const chf = rt.CHF || 0.8365;
    const aud = rt.AUD ? (1/rt.AUD) : 0.6790;
    const nzd = rt.NZD ? (1/rt.NZD) : 0.5542;
    S.fx.quotes = [
      {sym:'EUR/USD', prc:eur.toFixed(4), chg:(S.fx.perf.EUR>=0?'+':'')+S.fx.perf.EUR.toFixed(2)+'%', up:S.fx.perf.EUR>=0},
      {sym:'GBP/USD', prc:gbp.toFixed(4), chg:(S.fx.perf.GBP>=0?'+':'')+S.fx.perf.GBP.toFixed(2)+'%', up:S.fx.perf.GBP>=0},
      {sym:'USD/JPY', prc:jpy.toFixed(2), chg:(S.fx.perf.JPY>=0?'-':'+')+Math.abs(S.fx.perf.JPY).toFixed(2)+'%', up:S.fx.perf.JPY<=0},
      {sym:'USD/CAD', prc:cad.toFixed(4), chg:(S.fx.perf.CAD>=0?'-':'+')+Math.abs(S.fx.perf.CAD).toFixed(2)+'%', up:S.fx.perf.CAD<=0}
    ];
    S.fx.live = true;
    if(S.mtab === 'strength') renderMradar();
  }catch(e){}
}

function renderNext(){
  const box = document.getElementById('nextBox'), now = Date.now(), L = UI[S.lang];
  if(!S.events.length){ box.innerHTML = ''; return; }

  // ۱) اولویت اول: خبر مهم یا متوسط یا تعطیلی بانکی در آینده
  let n = S.events.filter(e => rank(e.impact) >= 2 && new Date(e.date).getTime() > now)
                  .sort((a,b) => new Date(a.date)-new Date(b.date))[0];
  let mode = 'major';

  // ۲) اگر همه خبرهای مهم هفته رد شده بودند (مثلاً عصر جمعه)، رویداد بعدی تقویم را نشان بده
  if(!n){
    n = S.events.filter(e => new Date(e.date).getTime() > now)
                .sort((a,b) => new Date(a.date)-new Date(b.date))[0];
    mode = 'any';
  }

  // ۳) اگر کل رویدادهای هفته تمام شده بود (آخر هفته)، آخرین خبر مهم هفته را در کادر نگه دار
  if(!n){
    const majors = S.events.filter(e => rank(e.impact) >= 2);
    n = (majors.length ? majors : S.events).slice(-1)[0];
    mode = 'done';
  }

  const t = new Date(n.date).getTime(), info = lookup(n.title);
  const soonCls = (mode !== 'done' && rank(n.impact) === 3 && t-now < 36e5) ? ' soon' : '';
  const dt = new Date(t);
  const r = dayRelLabel(dayKey(dt));
  const dateStr = S.lang === 'fa'
    ? ((r ? r.txt + ' · ' : '') + weekdayFa(dt) + ' ' + dateFa(dt) + ' · ' + fmtTime(dt))
    : ((r ? r.txt + ' · ' : '') + dateEnShort(dt) + ' · ' + fmtTime(dt));
  const titleMain = S.lang === 'fa' ? (info ? toFaNum(info.fa) : n.title) : n.title;

  const badgeTxt = mode === 'done'
    ? L.weekDoneBadge
    : (isHoliday(n.impact) ? L.nextHoliday : (mode === 'any' ? L.nextAny : L.nextNews));

  const sideTimer = mode === 'done'
    ? '<span class="cd-now">'+L.weekDoneStat+'</span>'
    : '<div data-cd-big="'+t+'">'+countdownHTML(t-now)+'</div>';

  box.innerHTML = '<div class="next '+impClass(n.impact)+soonCls+'">'+
    '<div class="next-info">'+
      '<div class="next-meta">'+
        '<span class="next-badge">'+badgeTxt+'</span>'+
        '<span class="next-cur"><i>'+(FLAG[n.country] || '')+'</i>'+esc(n.country)+'</span>'+
        '<span class="next-time">'+dateStr+'</span>'+
      '</div>'+
      '<div class="next-title">'+esc(titleMain)+'</div>'+
      (S.lang === 'fa' && info ? '<div class="next-en">'+esc(n.title)+'</div>' : '')+
    '</div>'+
    '<div class="next-side">'+
      bullsHTML(n.impact, false)+
      sideTimer+
    '</div>'+
  '</div>';
}

  if(c.dataset.scope){
    S.scope = c.dataset.scope;
    document.querySelectorAll('#scopeFilters .seg-btn[data-scope]').forEach(x => x.setAttribute('aria-pressed', x === c));
  }else if(c.dataset.imp){
    S.imp = c.dataset.imp;
    document.querySelectorAll('#scopeFilters .seg-btn[data-imp]').forEach(x => x.setAttribute('aria-pressed', x === c));
  }
  savePrefs(); render();
});
document.getElementById('curFilters').addEventListener('click', ev => {
  const c = ev.target.closest('.chip'); if(!c) return;
  const cu = c.dataset.cur;
  if(cu === '__all__'){
    S.curs.clear();
  }else{
    S.curs.has(cu) ? S.curs.delete(cu) : S.curs.add(cu);
  }
  buildCurFilters();
  savePrefs(); render();
});
document.getElementById('tzBtn').addEventListener('click', () => {
  S.tz = S.tz === 'device' ? 'tehran' : 'device';
  syncChips();
  savePrefs(); render();
});
document.getElementById('refBtn').addEventListener('click', () => boot(true));
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && Date.now() - S.last > 15*60*1000) boot(false);
});

/* ===================== boot & i18n ===================== */
function applyLang(){
  const L = UI[S.lang];
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'en' ? 'ltr' : 'rtl';
  document.title = L.docTitle;
  document.getElementById('brandTitle').textContent = L.brandTitle;
  document.getElementById('brandSub').textContent = L.brandSub;
  document.getElementById('langBtn').textContent = L.langBtn;
  document.getElementById('scToday').textContent = L.scToday;
  document.getElementById('scWeek').textContent = L.scWeek;
  document.getElementById('imHigh').textContent = L.imHigh;
  document.getElementById('imMed').textContent = L.imMed;
  document.getElementById('imAll').textContent = L.imAll;
  document.getElementById('noteBase').textContent = L.noteBase;
  document.getElementById('creditLbl').textContent = L.creditLbl;
  document.getElementById('creditName').textContent = L.creditName;
  document.getElementById('verTag').textContent = L.verTag;
  document.querySelector('[data-i18n="t_light"]').textContent = L.themeLight;
  document.querySelector('[data-i18n="t_dark"]').textContent = L.themeDark;
  document.querySelector('[data-i18n="t_auto"]').textContent = L.themeAuto;
  document.querySelector('[data-i18n="t_light_s"]').textContent = L.themeLightSub;
  document.querySelector('[data-i18n="t_dark_s"]').textContent = L.themeDarkSub;
  document.querySelector('[data-i18n="t_auto_s"]').textContent = L.themeAutoSub;
  document.getElementById('mtabSess').textContent = L.mtabSess;
  document.getElementById('mtabStr').textContent = L.mtabStr;
  document.getElementById('mtabCorr').textContent = L.mtabCorr;
  syncChips();
  applyTheme();
}

function buildCurFilters(){
  const L = UI[S.lang];
  const order = ['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD','CNY','All'];
  const seen = [...new Set(S.events.map(e => e.country))]
    .sort((a,b) => (order.indexOf(a)+99)%100 - (order.indexOf(b)+99)%100);
  const allBtn = '<button class="chip all-cur" data-cur="__all__" aria-pressed="'+(S.curs.size===0)+'">'+L.allCurs+'</button>';
  const curBtns = seen.map(c =>
    '<button class="chip cur" data-cur="'+c+'" aria-pressed="'+S.curs.has(c)+'"><i>'+(FLAG[c]||'')+'</i>'+c+'</button>'
  ).join('');
  document.getElementById('curFilters').innerHTML = allBtn + curBtns;
}

function syncChips(){
  const L = UI[S.lang];
  document.querySelectorAll('#scopeFilters .seg-btn[data-scope]')
    .forEach(x => x.setAttribute('aria-pressed', x.dataset.scope === S.scope));
  document.querySelectorAll('#scopeFilters .seg-btn[data-imp]')
    .forEach(x => x.setAttribute('aria-pressed', x.dataset.imp === S.imp));
  document.getElementById('tzTxt').textContent = S.tz === 'tehran' ? L.tzTehran : L.tzDevice;
  document.getElementById('viewTxt').textContent = S.view === 'table' ? L.viewCards : L.viewTable;
}

async function boot(manual){
  const btn = document.getElementById('refBtn');
  if(manual && Date.now() - S.last < 30*1000) return;
  btn.disabled = true;
  try{
    const data = await loadEvents();
    S.events = data.sort((a,b) => new Date(a.date) - new Date(b.date));
    S.last = Date.now();
    buildCurFilters(); render(); showSource();
  }catch(err){
    document.getElementById('list').innerHTML =
      '<div class="state"><b>Error</b>'+esc(err.message)+'</div>';
  }
  btn.disabled = false;
}

function showSource(){
  const el = document.getElementById('upd');
  if(!el) return;
  if(S.src === 'live'){
    el.textContent = S.lang === 'fa' ? ' · مستقیم از فارکس‌فکتوری' : ' · Live from Forex Factory';
    return;
  }
  if(S.src === 'cache'){
    el.textContent = S.lang === 'fa' ? ' · آفلاین: آخرین نسخه‌ی ذخیره‌شده' : ' · Offline cached copy';
    return;
  }
  if(S.src === 'fallback'){
    el.textContent = S.lang === 'fa' ? ' · داده تقویم هفته جاری' : ' · Current week snapshot';
    return;
  }
  if(S.src === 'repo'){
    el.textContent = S.lang === 'fa' ? ' · به‌روزرسانی خودکار هر ساعت' : ' · Auto-updated hourly';
    fetch('./updated.json?t=' + Math.floor(Date.now()/6e5), {cache:'no-store'})
      .then(r => r.ok ? r.json() : null)
      .then(o => {
        if(!o || !o.updated) return;
        const m = Math.round((Date.now() - new Date(o.updated))/6e4);
        if(S.lang === 'fa'){
          el.textContent = ' · آخرین به‌روزرسانی: ' +
            (m < 60 ? toFaNum(m) + ' دقیقه پیش' : toFaNum(Math.round(m/60)) + ' ساعت پیش');
        }else{
          el.textContent = ' · Last updated: ' +
            (m < 60 ? m + 'm ago' : Math.round(m/60) + 'h ago');
        }
      }).catch(() => {});
  }
}

/* ---------- مدیریت تم ---------- */
const LIGHT = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;

function applyTheme(){
  const L = UI[S.lang];
  const resolved = S.theme === 'auto' ? (LIGHT && LIGHT.matches ? 'light' : 'dark') : S.theme;
  document.documentElement.dataset.theme = resolved;
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', resolved === 'light' ? '#F1F5F9' : '#0F172A');
  const mapTxt = {light:L.themeLight, dark:L.themeDark, auto:L.themeAuto};
  document.getElementById('themeTxt').textContent = mapTxt[S.theme];
  const icon = document.getElementById('themeIcon');
  if(icon){
    icon.innerHTML = resolved === 'light'
      ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
      : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
  document.querySelectorAll('.topt').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.theme === S.theme));
}
if(LIGHT && LIGHT.addEventListener)
  LIGHT.addEventListener('change', () => { if(S.theme === 'auto') applyTheme(); });

const themeBtn = document.getElementById('themeBtn');
const themePop = document.getElementById('themePop');
function closeTheme(){ themePop.hidden = true; themeBtn.setAttribute('aria-expanded','false'); }
themeBtn.addEventListener('click', e => {
  e.stopPropagation();
  const open = themePop.hidden;
  themePop.hidden = !open;
  themeBtn.setAttribute('aria-expanded', String(open));
});
themePop.addEventListener('click', e => {
  const b = e.target.closest('.topt'); if(!b) return;
  S.theme = b.dataset.theme;
  savePrefs(); applyTheme(); closeTheme();
});
document.addEventListener('click', e => { if(!e.target.closest('.tw')) closeTheme(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeTheme(); });

if('serviceWorker' in navigator){
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

loadPrefs(); applyLang(); boot(false); fetchLiveFX();
setInterval(() => { if(!document.hidden) boot(false); }, 15*60*1000);
</script>
</body>
</html>
