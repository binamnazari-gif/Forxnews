name: Update calendar

on:
  schedule:
    - cron: "17 * * * *"       # هر ساعت
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fetch calendar
        id: fetch
        run: |
          FEED="https://nfs.faireconomy.media/ff_calendar_thisweek.json"
          # چند مسیر مستقل؛ اگر یکی ۴۲۹ داد، بعدی از IP دیگری می‌خواند
          URLS="
          $FEED
          https://cdn-nfs.faireconomy.media/ff_calendar_thisweek.json
          https://api.allorigins.win/raw?url=https%3A%2F%2Fnfs.faireconomy.media%2Fff_calendar_thisweek.json
          https://r.jina.ai/$FEED
          "
          ok=0
          for round in 1 2 3; do
            for url in $URLS; do
              echo "::group::دور $round — $url"
              curl -sSL --max-time 45 --compressed \
                -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" \
                -H "Accept: application/json,text/plain,*/*" \
                -H "Accept-Language: en-US,en;q=0.9" \
                "$url" -o raw.txt || echo "curl ناموفق"
              if python3 - <<'PY'
          import json, sys, pathlib
          t = pathlib.Path('raw.txt').read_text(errors='ignore') if pathlib.Path('raw.txt').exists() else ''
          a, b = t.find('['), t.rfind(']')
          if a < 0 or b < a:
              sys.exit(1)
          try:
              d = json.loads(t[a:b+1])
          except Exception:
              sys.exit(1)
          if not isinstance(d, list) or len(d) < 5:
              sys.exit(1)
          if not all(isinstance(x, dict) and 'title' in x and 'date' in x for x in d[:5]):
              sys.exit(1)
          json.dump(d, open('fresh.json', 'w'), ensure_ascii=False, separators=(',', ':'))
          print('رویداد معتبر:', len(d))
          PY
              then
                echo "موفق"; ok=1; echo "::endgroup::"; break
              fi
              echo "پاسخ معتبر نبود"
              echo "::endgroup::"
              sleep 40
            done
            [ "$ok" = "1" ] && break
            echo "همه‌ی مسیرها رد شدند؛ ۳ دقیقه صبر و دور بعد"
            sleep 180
          done
          rm -f raw.txt
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Save and commit
        run: |
          if [ "${{ steps.fetch.outputs.ok }}" != "1" ]; then
            if [ -f calendar.json ]; then
              echo "فید در دسترس نبود؛ فایل قبلی حفظ شد. اجرای بعدی خودش دوباره تلاش می‌کند."
              exit 0
            fi
            echo "فید در دسترس نبود و فایل قبلی هم وجود ندارد."
            exit 1
          fi
          mv fresh.json calendar.json
          date -u '+{"updated":"%Y-%m-%dT%H:%M:%SZ"}' > updated.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json updated.json
          if git diff --staged --quiet; then
            echo "تغییری نبود."
          else
            git commit -m "calendar: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
